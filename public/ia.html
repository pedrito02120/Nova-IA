<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova IA</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    background:
        radial-gradient(circle at 50% 0%,#420000,#0b0000 40%,#000 80%);
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:65px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 15px;
    background:rgba(5,0,0,.94);
    border-bottom:1px solid rgba(255,0,0,.25);
    z-index:10;
}

.menu-btn,
.delete-btn{
    width:40px;
    height:40px;
    border:none;
    border-radius:10px;
    background:#180000;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.logo-small{
    width:42px;
    height:42px;
    border-radius:50%;
    overflow:hidden;
    border:2px solid #ff2020;
    box-shadow:0 0 15px rgba(255,0,0,.5);
    flex-shrink:0;
}

.logo-small img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.title{
    flex:1;
}

.title h1{
    font-size:18px;
}

.title p{
    color:#ff5555;
    font-size:11px;
    margin-top:3px;
}


/* CHAT */

.chat{
    flex:1;
    overflow-y:auto;
    padding:35px 15px 110px;
    scroll-behavior:smooth;
}

.messages{
    max-width:850px;
    margin:auto;
}


/* BIENVENIDA */

.welcome-message{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:25px 10px 45px;
}

.logo-container{
    position:relative;
    width:145px;
    height:145px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:25px;
}

.big-logo{
    width:110px;
    height:110px;
    border-radius:50%;
    overflow:hidden;
    border:3px solid rgba(255,50,50,.8);
    box-shadow:
        0 0 25px rgba(255,0,0,.45),
        0 0 60px rgba(255,0,0,.15);
    position:relative;
    z-index:2;
}

.big-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.logo-ring{
    position:absolute;
    width:135px;
    height:135px;
    border-radius:50%;
    border:3px solid transparent;
    border-top-color:#ff0000;
    border-right-color:#ff4444;
    animation:ringSpin 1.5s linear infinite;
    filter:drop-shadow(0 0 8px #ff0000);
    z-index:1;
}

.logo-glow{
    position:absolute;
    width:165px;
    height:165px;
    border-radius:50%;
    background:
        radial-gradient(circle,rgba(255,0,0,.25),transparent 70%);
    animation:glowPulse 2s ease-in-out infinite;
}

@keyframes ringSpin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

@keyframes glowPulse{
    0%,100%{
        transform:scale(.8);
        opacity:.3;
    }

    50%{
        transform:scale(1.15);
        opacity:.7;
    }
}

.welcome-message h2{
    font-size:30px;
    margin-bottom:12px;
}

.welcome-message h2 span{
    color:#ff2929;
    text-shadow:0 0 20px rgba(255,0,0,.5);
}

.welcome-description{
    max-width:570px;
    color:#aaa;
    font-size:15px;
    line-height:1.6;
    margin-bottom:20px;
}

.suggestions{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
}

.suggestion{
    padding:8px 13px;
    border-radius:20px;
    background:rgba(80,0,0,.35);
    border:1px solid #571010;
    color:#ff7777;
    font-size:12px;
}


/* MENSAJES */

.message{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    animation:messageAppear .25s ease;
}

@keyframes messageAppear{
    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message.user{
    justify-content:flex-end;
}

.avatar{
    width:35px;
    height:35px;
    flex-shrink:0;
    border-radius:50%;
    overflow:hidden;
    border:1px solid #ff3030;
    box-shadow:0 0 10px rgba(255,0,0,.25);
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.bubble{
    max-width:80%;
    padding:13px 16px;
    border-radius:16px;
    line-height:1.5;
    white-space:pre-wrap;
    word-wrap:break-word;
}

.message.ai .bubble{
    background:#180000;
    border:1px solid #350000;
    border-top-left-radius:4px;
}

.message.user .bubble{
    background:linear-gradient(135deg,#e60000,#800000);
    border-top-right-radius:4px;
}


/* ===============================
   CAJAS DE CÓDIGO
================================ */

.code-wrapper{
    position:relative;
    width:100%;
    margin:10px 0;
    border:1px solid #3d0000;
    border-radius:10px;
    background:#080000;
    overflow:hidden;
    box-shadow:0 0 12px rgba(255,0,0,.08);
}

.code-header{
    height:38px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;
    background:#160000;
    border-bottom:1px solid #350000;
    color:#ff5555;
    font-size:12px;
}

.copy-code{
    border:none;
    border-radius:7px;
    padding:6px 10px;
    background:#300000;
    color:#fff;
    cursor:pointer;
    font-size:12px;
}

.copy-code:hover{
    background:#550000;
}

.code-content{
    max-height:280px;
    overflow:auto;
    padding:14px;
    margin:0;
    color:#f1f1f1;
    font-family:"Courier New",monospace;
    font-size:13px;
    line-height:1.5;
    white-space:pre;
    tab-size:4;
}

.code-content::-webkit-scrollbar{
    width:7px;
    height:7px;
}

.code-content::-webkit-scrollbar-track{
    background:#080000;
}

.code-content::-webkit-scrollbar-thumb{
    background:#650000;
    border-radius:10px;
}

.code-content::-webkit-scrollbar-thumb:hover{
    background:#a00000;
}


/* PENSANDO */

.thinking{
    display:flex;
    gap:5px;
    padding:13px 16px;
    background:#180000;
    border-radius:16px;
}

.dot{
    width:7px;
    height:7px;
    background:#ff3333;
    border-radius:50%;
    animation:dot 1.2s infinite;
}

.dot:nth-child(2){
    animation-delay:.2s;
}

.dot:nth-child(3){
    animation-delay:.4s;
}

@keyframes dot{
    0%,60%,100%{
        transform:translateY(0);
        opacity:.3;
    }

    30%{
        transform:translateY(-5px);
        opacity:1;
    }
}


/* INPUT */

.input-area{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    padding:12px 15px 15px;
    background:linear-gradient(transparent,#000 35%);
    z-index:5;
}

.input-box{
    max-width:850px;
    margin:auto;
    display:flex;
    gap:8px;
    padding:8px;
    background:#120000;
    border:1px solid #400000;
    border-radius:17px;
}

textarea{
    flex:1;
    min-height:44px;
    max-height:130px;
    resize:none;
    border:none;
    outline:none;
    background:transparent;
    color:white;
    padding:11px;
    font-size:15px;
}

textarea::placeholder{
    color:#777;
}

.send-btn{
    width:44px;
    height:44px;
    border:none;
    border-radius:50%;
    background:linear-gradient(145deg,#ff2424,#870000);
    color:white;
    font-size:20px;
    cursor:pointer;
}


/* ===============================
   SIDEBAR
================================ */

.sidebar{
    position:fixed;
    top:0;
    bottom:0;
    left:0;
    width:290px;
    background:#100000;
    border-right:2px solid #ff0000;
    z-index:20;
    transform:translateX(-100%);
    transition:.25s;
    overflow:hidden;
}

.sidebar.open{
    transform:translateX(0);
}

.sidebar-header{
    height:65px;
    display:flex;
    align-items:center;
    padding:0 15px;
    border-bottom:1px solid #350000;
    position:relative;
    z-index:2;
}

.sidebar-title{
    flex:1;
    font-weight:bold;
}

.close-sidebar{
    background:none;
    border:none;
    color:white;
    font-size:25px;
    cursor:pointer;
}


/* LOGO SIDEBAR */

.sidebar-logo-area{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px 10px 8px;
}

.menu-logo-container{
    position:relative;
    width:120px;
    height:120px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.menu-logo{
    width:85px;
    height:85px;
    border-radius:50%;
    overflow:hidden;
    border:2px solid #ff2222;
    box-shadow:0 0 25px rgba(255,0,0,.6);
    z-index:2;
}

.menu-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.menu-ring{
    position:absolute;
    width:108px;
    height:108px;
    border-radius:50%;
    border:3px solid transparent;
    border-top-color:#ff0000;
    border-right-color:#ff5555;
    animation:ringSpin 1.4s linear infinite;
    filter:drop-shadow(0 0 7px #ff0000);
}

.menu-glow{
    position:absolute;
    width:130px;
    height:130px;
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            rgba(255,0,0,.25),
            transparent 70%
        );
    animation:glowPulse 2s infinite;
}

.menu-logo-name{
    margin-top:2px;
    font-size:22px;
    font-weight:bold;
    color:#ff2929;
    text-shadow:
        0 0 8px #ff0000,
        0 0 20px rgba(255,0,0,.5);
    animation:nameGlow 2s ease-in-out infinite;
}

@keyframes nameGlow{
    0%,100%{
        opacity:.75;
        transform:scale(1);
    }

    50%{
        opacity:1;
        transform:scale(1.06);
    }
}


/* BOTONES SIDEBAR */

.new-chat{
    margin:8px 15px;
    width:calc(100% - 30px);
    padding:12px;
    border:none;
    border-radius:10px;
    background:#350000;
    color:white;
    cursor:pointer;
}

.new-chat:hover{
    background:#520000;
}


/* LISTA */

.chat-list{
    padding:0 12px 30px;
    overflow-y:auto;
    height:calc(100vh - 285px);
}

.chat-item{
    padding:12px;
    border-radius:9px;
    margin-bottom:6px;
    color:#ccc;
    cursor:pointer;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    border:1px solid transparent;
}

.chat-item:hover{
    background:#280000;
}

.chat-item.selected{
    background:#350000;
    border-color:#ff2222;
}

.delete-mode{
    color:#ff3333;
}

.delete-chat{
    float:right;
    color:#ff3333;
}


/* OVERLAY */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:19;
    display:none;
}

.overlay.show{
    display:block;
}


/* ===============================
   CONFIRMACIÓN NOVA
================================ */

.nova-confirm-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
    opacity:0;
    pointer-events:none;
    transition:.25s ease;
}

.nova-confirm-overlay.show{
    opacity:1;
    pointer-events:auto;
}

.nova-confirm{
    position:relative;
    width:calc(100% - 40px);
    max-width:360px;
    padding:28px 22px;
    border-radius:18px;
    background:
        radial-gradient(
            circle at 50% 0%,
            #420000,
            #120000 55%,
            #070000
        );
    border:1px solid #700000;
    box-shadow:
        0 0 25px rgba(255,0,0,.35),
        0 0 70px rgba(255,0,0,.12);
    transform:scale(.88) translateY(15px);
    transition:.3s ease;
    overflow:hidden;
}

.nova-confirm-overlay.show .nova-confirm{
    transform:scale(1) translateY(0);
}

.nova-confirm::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:18px;
    border:2px solid transparent;
    background:
        linear-gradient(
            90deg,
            transparent,
            #ff0000,
            #ff5555,
            transparent
        ) top/100% 2px no-repeat,

        linear-gradient(
            180deg,
            transparent,
            #ff0000,
            #ff5555,
            transparent
        ) right/2px 100% no-repeat,

        linear-gradient(
            270deg,
            transparent,
            #ff0000,
            #ff5555,
            transparent
        ) bottom/100% 2px no-repeat,

        linear-gradient(
            0deg,
            transparent,
            #ff0000,
            #ff5555,
            transparent
        ) left/2px 100% no-repeat;

    animation:novaBorder 3s linear infinite;
    pointer-events:none;
}

@keyframes novaBorder{

    0%{
        filter:brightness(.7);
    }

    25%{
        filter:brightness(2);
    }

    50%{
        filter:brightness(.8);
    }

    75%{
        filter:brightness(2);
    }

    100%{
        filter:brightness(.7);
    }
}

.nova-confirm-logo{
    width:65px;
    height:65px;
    margin:0 auto 15px;
    border-radius:50%;
    overflow:hidden;
    border:2px solid #ff2222;
    box-shadow:0 0 18px rgba(255,0,0,.55);
    animation:novaLogoPulse 2s ease-in-out infinite;
}

.nova-confirm-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

@keyframes novaLogoPulse{

    0%,100%{
        transform:scale(1);
        box-shadow:0 0 15px rgba(255,0,0,.35);
    }

    50%{
        transform:scale(1.06);
        box-shadow:0 0 28px rgba(255,0,0,.7);
    }
}

.nova-confirm h3{
    text-align:center;
    color:white;
    font-size:20px;
    margin-bottom:8px;
}

.nova-confirm h3 span{
    color:#ff2929;
    text-shadow:0 0 12px rgba(255,0,0,.5);
}

.nova-confirm p{
    text-align:center;
    color:#aaa;
    font-size:13px;
    line-height:1.5;
    margin-bottom:20px;
}

.nova-confirm-buttons{
    display:flex;
    gap:9px;
}

.nova-confirm-buttons button{
    flex:1;
    padding:11px;
    border:none;
    border-radius:10px;
    color:white;
    cursor:pointer;
    font-weight:bold;
    transition:.2s;
}

.nova-cancel{
    background:#260000;
    border:1px solid #4d0000 !important;
}

.nova-cancel:hover{
    background:#3b0000;
}

.nova-delete{
    background:
        linear-gradient(
            135deg,
            #d00000,
            #650000
        );
    box-shadow:0 0 15px rgba(255,0,0,.2);
}

.nova-delete:hover{
    transform:translateY(-2px);
    box-shadow:0 0 25px rgba(255,0,0,.45);
}


/* MOVIL */

@media(max-width:500px){

    .welcome-message h2{
        font-size:25px;
    }

    .welcome-description{
        font-size:14px;
    }

    .logo-container{
        width:125px;
        height:125px;
    }

    .big-logo{
        width:95px;
        height:95px;
    }

    .logo-ring{
        width:118px;
        height:118px;
    }

    .logo-glow{
        width:145px;
        height:145px;
    }

    .code-content{
        max-height:230px;
        font-size:12px;
    }

}

</style>
</head>

<body>

<div class="app">

<header class="header">

<button
class="menu-btn"
onclick="openSidebar()">
☰
</button>

<div class="logo-small">

<img
src="https://i.ibb.co/whKQvZsw/Nova.jpg"
alt="Nova IA">

</div>

<div class="title">

<h1>Nova IA</h1>

<p>
Especializada en Delta Executor
</p>

</div>

<button
class="delete-btn"
onclick="clearChat()">
🗑️
</button>

</header>


<main
class="chat"
id="chat">

<div
class="messages"
id="messages">

<div class="welcome-message">

<div class="logo-container">

<div class="logo-glow"></div>

<div class="logo-ring"></div>

<div class="big-logo">

<img
src="https://i.ibb.co/whKQvZsw/Nova.jpg"
alt="Nova IA">

</div>

</div>

<h2>
Hola, soy <span>Nova IA</span>
</h2>

<p class="welcome-description">

¿Qué quieres crear hoy?

<br>

Puedo ayudarte con
<b>Delta Executor</b>,
Roblox y scripts
<b>Lua/Luau.</b>

</p>

<div class="suggestions">

<div class="suggestion">Lua</div>
<div class="suggestion">Roblox</div>
<div class="suggestion">Delta</div>
<div class="suggestion">Scripts</div>
<div class="suggestion">Debug</div>

</div>

</div>

</div>

</main>


<div class="input-area">

<div class="input-box">

<textarea
id="messageInput"
placeholder="¿Qué quieres crear hoy?"
rows="1"></textarea>

<button
class="send-btn"
onclick="sendMessage()">
➤
</button>

</div>

</div>

</div>


<div
class="overlay"
id="overlay"
onclick="closeSidebar()">
</div>


<aside
class="sidebar"
id="sidebar">

<div class="sidebar-header">

<div class="sidebar-title">
💬 Mis chats
</div>

<button
class="close-sidebar"
onclick="closeSidebar()">
×
</button>

</div>


<div class="sidebar-logo-area">

<div class="menu-logo-container">

<div class="menu-glow"></div>

<div class="menu-ring"></div>

<div class="menu-logo">

<img
src="https://i.ibb.co/whKQvZsw/Nova.jpg"
alt="Nova">

</div>

</div>

<div class="menu-logo-name">
Nova IA
</div>

</div>


<button
class="new-chat"
onclick="newChat()">

＋ Nuevo chat

</button>


<button
class="new-chat"
onclick="toggleDeleteMode()"
id="editButton">

✏️ Editar chats

</button>


<div
class="chat-list"
id="chatList">
</div>

</aside>


<script>

/* ===============================
   CONFIGURACIÓN
================================ */

const RENDER_URL =
"https://nova-ia-2oup.onrender.com";

const CHAT_URL =
RENDER_URL + "/chat";

const STORAGE_KEY =
"nova_chats";

const CURRENT_KEY =
"nova_current";

let chats =
JSON.parse(
localStorage.getItem(STORAGE_KEY) || "[]"
);

let currentId =
localStorage.getItem(CURRENT_KEY);

let deleteMode =
false;


/* ===============================
   GUARDAR
================================ */

function save(){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(chats)
);

if(currentId){

localStorage.setItem(
CURRENT_KEY,
currentId
);

}

}


/* ===============================
   CREAR CHAT
================================ */

function createChat(){

const chat = {

id:Date.now().toString(),

title:"Nuevo chat",

messages:[]

};

chats.unshift(chat);

currentId =
chat.id;

save();

}


/* ===============================
   CHAT ACTUAL
================================ */

function currentChat(){

return chats.find(
chat => chat.id === currentId
);

}


/* ===============================
   RENDER
================================ */

function render(){

const box =
document.getElementById("messages");

const welcome =
box.querySelector(".welcome-message");

box.innerHTML = "";

if(welcome){

box.appendChild(welcome);

}

const chat =
currentChat();

if(!chat){

return;

}

chat.messages.forEach(
message => {

addMessage(
message.role,
message.content
);

});

renderChatList();

scrollBottom();

}


/* ===============================
   MENSAJES
================================ */

function addMessage(
role,
content
){

const box =
document.getElementById("messages");

const row =
document.createElement("div");

row.className =
"message " +
(
role === "user"
?
"user"
:
"ai"
);


if(role === "ai"){

const avatar =
document.createElement("div");

avatar.className =
"avatar";

avatar.innerHTML = `

<img
src="https://i.ibb.co/whKQvZsw/Nova.jpg"
alt="Nova">

`;

row.appendChild(avatar);

}


const bubble =
document.createElement("div");

bubble.className =
"bubble";


const codeRegex =
/```(?:[a-zA-Z0-9_+-]+)?\s*\n?([\s\S]*?)```/g;

let lastIndex = 0;

let match;

let hasCode = false;


while(
(match = codeRegex.exec(content))
!== null
){

hasCode = true;


const before =
content.substring(
lastIndex,
match.index
);


if(before.trim()){

const text =
document.createElement("div");

text.textContent =
before;

text.style.whiteSpace =
"pre-wrap";

text.style.marginBottom =
"8px";

bubble.appendChild(text);

}


const wrapper =
document.createElement("div");

wrapper.className =
"code-wrapper";


const header =
document.createElement("div");

header.className =
"code-header";


const label =
document.createElement("span");

label.textContent =
"Código";


const copy =
document.createElement("button");

copy.className =
"copy-code";

copy.textContent =
"📋 Copiar";


const codeText =
match[1]
.replace(/^\n/,"")
.replace(/\n$/,"");


copy.onclick =
async function(){

try{

/* ===============================
   ENVIAR
================================ */

async function sendMessage(){

const input =
document.getElementById("messageInput");

const message =
input.value.trim();


if(!message){

return;

}


const chat =
currentChat();

if(!chat){

return;

}


chat.messages.push({

role:"user",

content:message

});


if(chat.title === "Nuevo chat"){

chat.title =
generateTitle(message);

}


input.value = "";

save();

render();

showThinking();


try{

const response =
await fetch(
CHAT_URL,
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
message:message
})

}
);


if(!response.ok){

throw new Error(
"HTTP " +
response.status
);

}


const data =
await response.json();


removeThinking();


const reply =
data.reply;


if(
!reply ||
typeof reply !== "string"
){

throw new Error(
"Respuesta inválida"
);

}


chat.messages.push({

role:"ai",

content:reply

});


save();

render();


}catch(error){

console.error(
"Nova error:",
error
);

removeThinking();


chat.messages.push({

role:"ai",

content:
"❌ No pude obtener una respuesta de Nova IA.\n\nComprueba que Render esté activo e inténtalo nuevamente."

});


save();

render();

}

}


/* ===============================
   TÍTULO AUTOMÁTICO
================================ */

function generateTitle(text){

let title =
text
.replace(/\s+/g," ")
.trim();


if(title.length > 45){

title =
title.substring(
0,
45
).trim();

}


if(title.length > 0){

title =
title.charAt(0).toUpperCase()
+
title.substring(1);

}


return title ||
"Nuevo proyecto";

}


/* ===============================
   LISTA DE CHATS
================================ */

function renderChatList(){

const list =
document.getElementById("chatList");

list.innerHTML = "";


chats.forEach(
chat => {

const item =
document.createElement("div");

item.className =
"chat-item";


if(chat.id === currentId){

item.classList.add(
"selected"
);

}


if(deleteMode){

item.classList.add(
"delete-mode"
);

item.innerHTML = `

<span>
${escapeHTML(chat.title)}
</span>

<span class="delete-chat">
🗑️
</span>

`;

item.onclick =
event => {

event.stopPropagation();

deleteChat(chat.id);

};

}else{

item.textContent =
chat.title;

item.onclick =
() => {

currentId =
chat.id;

save();

render();

closeSidebar();

};

}


list.appendChild(item);

});

}


/* ===============================
   ESCAPAR HTML
================================ */

function escapeHTML(text){

return text
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ===============================
   MODO ELIMINAR
================================ */

function toggleDeleteMode(){

deleteMode =
!deleteMode;


const button =
document.getElementById(
"editButton"
);


button.textContent =
deleteMode
?
"✏️ Terminar edición"
:
"✏️ Editar chats";


renderChatList();

}


/* ===============================
   CONFIRMACIÓN BONITA
================================ */

function deleteChat(id){

const chat =
chats.find(
c => c.id === id
);

if(!chat){

return;

}


const old =
document.getElementById(
"novaConfirmOverlay"
);

if(old){

old.remove();

}


const overlay =
document.createElement("div");

overlay.id =
"novaConfirmOverlay";

overlay.className =
"nova-confirm-overlay";


overlay.innerHTML = `

<div class="nova-confirm">

<div class="nova-confirm-logo">

<img
src="https://i.ibb.co/whKQvZsw/Nova.jpg"
alt="Nova">

</div>

<h3>
¿Eliminar <span>este chat</span>?
</h3>

<p>
La conversación
<b>${escapeHTML(chat.title)}</b>
se eliminará de tus chats guardados.
<br><br>
Esta acción no se puede deshacer.
</p>

<div class="nova-confirm-buttons">

<button
class="nova-cancel"
onclick="closeNovaConfirm()">

Cancelar

</button>

<button
class="nova-delete"
onclick="confirmNovaDelete('${chat.id}')">

🗑️ Eliminar

</button>

</div>

</div>

`;


document.body.appendChild(
overlay
);


requestAnimationFrame(
() => {

overlay.classList.add(
"show"
);

}
);

}


/* ===============================
   CERRAR CONFIRMACIÓN
================================ */

function closeNovaConfirm(){

const overlay =
document.getElementById(
"novaConfirmOverlay"
);

if(!overlay){

return;

}

overlay.classList.remove(
"show"
);

setTimeout(
() => {

overlay.remove();

},
250
);

}


/* ===============================
   CONFIRMAR BORRADO
================================ */

function confirmNovaDelete(id){

chats =
chats.filter(
chat => chat.id !== id
);


if(currentId === id){

if(chats.length){

currentId =
chats[0].id;

}else{

createChat();

}

}


save();

closeNovaConfirm();

render();

}


/* ===============================
   NUEVO CHAT
================================ */

function newChat(){

createChat();

deleteMode =
false;

document.getElementById(
"editButton"
).textContent =
"✏️ Editar chats";

render();

closeSidebar();

}


/* ===============================
   BORRAR MENSAJES DEL CHAT
================================ */

function clearChat(){

const chat =
currentChat();


if(!chat){

return;

}


chat.messages = [];

save();

render();

}


/* ===============================
   SIDEBAR
================================ */

function openSidebar(){

document
.getElementById("sidebar")
.classList.add("open");

document
.getElementById("overlay")
.classList.add("show");

}


function closeSidebar(){

document
.getElementById("sidebar")
.classList.remove("open");

document
.getElementById("overlay")
.classList.remove("show");

}


/* ===============================
   SCROLL
================================ */

function scrollBottom(){

setTimeout(
() => {

const chat =
document.getElementById("chat");

chat.scrollTop =
chat.scrollHeight;

},
50
);

}


/* ===============================
   ENTER
================================ */

document
.getElementById("messageInput")
.addEventListener(
"keydown",
event => {

if(
event.key === "Enter" &&
!event.shiftKey
){

event.preventDefault();

sendMessage();

}

}
);


/* ===============================
   INICIO
================================ */

if(!chats.length){

createChat();

}
else if(!currentChat()){

currentId =
chats[0].id;

save();

}


render();
