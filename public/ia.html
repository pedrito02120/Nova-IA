<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NOVA IA</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --yellow:#fff000;
    --yellow2:#ffe600;
    --cyan:#59dcff;
    --cyan2:#22c8ff;
    --black:#030303;
    --panel:#080808;
    --panel2:#0d0d0d;
    --border:rgba(255,240,0,.14);
    --text:#f4f4f4;
    --muted:#888;
}

html,body{
    width:100%;
    height:100%;
}

body{
    background:#030303;
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

/* =========================
   FONDO ANIMADO
========================= */

.background{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
    background:
        radial-gradient(circle at 25% 15%,rgba(255,240,0,.045),transparent 25%),
        radial-gradient(circle at 80% 80%,rgba(50,210,255,.045),transparent 25%),
        #030303;
}

.grid{
    position:absolute;
    width:180%;
    height:180%;
    left:-40%;
    top:-20%;
    opacity:.09;
    background-image:
        linear-gradient(rgba(255,240,0,.18) 1px,transparent 1px),
        linear-gradient(90deg,rgba(80,220,255,.12) 1px,transparent 1px);
    background-size:60px 60px;
    transform:perspective(600px) rotateX(65deg);
    animation:gridMove 20s linear infinite;
}

@keyframes gridMove{
    from{
        transform:perspective(600px) rotateX(65deg) translateY(0);
    }
    to{
        transform:perspective(600px) rotateX(65deg) translateY(60px);
    }
}

.glow{
    position:absolute;
    border-radius:50%;
    filter:blur(55px);
    opacity:.10;
}

.glow.yellow{
    width:300px;
    height:300px;
    background:var(--yellow);
    left:-130px;
    top:25%;
    animation:yellowGlow 14s ease-in-out infinite;
}

.glow.cyan{
    width:270px;
    height:270px;
    background:var(--cyan);
    right:-120px;
    bottom:15%;
    animation:cyanGlow 17s ease-in-out infinite;
}

@keyframes yellowGlow{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(150px,-70px);}
}

@keyframes cyanGlow{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(-140px,80px);}
}

/* =========================
   APP
========================= */

.app{
    position:relative;
    z-index:2;
    width:100%;
    height:100%;
    display:flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:270px;
    height:100%;
    background:rgba(5,5,5,.90);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:16px;
    transition:transform .3s ease;
    z-index:20;
}

.sidebarTop{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:800;
}

.brand img{
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid var(--yellow);
    box-shadow:0 0 15px rgba(255,240,0,.15);
    animation:brandPulse 3s ease-in-out infinite;
}

@keyframes brandPulse{
    0%,100%{box-shadow:0 0 10px rgba(255,240,0,.12);}
    50%{box-shadow:0 0 20px rgba(255,240,0,.35);}
}

.brand span span{
    color:var(--yellow);
}

.newChat{
    width:100%;
    height:43px;
    border:1px solid rgba(255,240,0,.22);
    border-radius:12px;
    background:rgba(255,240,0,.05);
    color:#ddd;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    transition:.2s;
    margin-bottom:15px;
}

.newChat:hover{
    border-color:var(--yellow);
    color:var(--yellow);
    background:rgba(255,240,0,.08);
    transform:translateY(-1px);
}

.newChat svg{
    width:17px;
    height:17px;
}

.chatTitle{
    color:#555;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    margin:8px 5px;
}

.chatList{
    flex:1;
    overflow-y:auto;
}

.chatItem{
    position:relative;
    padding:11px 12px;
    border-radius:11px;
    margin-bottom:5px;
    color:#999;
    font-size:13px;
    cursor:pointer;
    transition:.2s;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    border:1px solid transparent;
}

.chatItem:hover{
    color:white;
    background:rgba(255,255,255,.035);
}

.chatItem.active{
    color:white;
    background:rgba(255,240,0,.065);
    border-color:rgba(255,240,0,.12);
}

.chatItem.active::before{
    content:"";
    position:absolute;
    left:0;
    top:10px;
    bottom:10px;
    width:2px;
    background:var(--yellow);
    box-shadow:0 0 10px var(--yellow);
}

.sidebarBottom{
    padding-top:12px;
    border-top:1px solid rgba(255,255,255,.06);
}

.creator{
    color:#666;
    font-size:11px;
    text-align:center;
}

.creator span{
    color:#aaa;
}

/* =========================
   MAIN
========================= */

.main{
    flex:1;
    height:100%;
    min-width:0;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:65px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 20px;
    border-bottom:1px solid rgba(255,255,255,.055);
    background:rgba(3,3,3,.55);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
}

.menuBtn{
    display:none;
}

.iconBtn{
    width:38px;
    height:38px;
    border:0;
    border-radius:10px;
    background:transparent;
    color:#888;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:.2s;
}

.iconBtn:hover{
    color:var(--yellow);
    background:rgba(255,240,0,.055);
}

.iconBtn svg{
    width:19px;
    height:19px;
}

.headerLogo{
    width:32px;
    height:32px;
    border-radius:50%;
    border:1px solid var(--yellow);
    animation:headerFloat 4s ease-in-out infinite;
}

@keyframes headerFloat{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-2px);}
}

.headerName{
    font-weight:700;
    font-size:14px;
}

.headerName span{
    color:var(--yellow);
}

.status{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:7px;
    color:#666;
    font-size:11px;
}

.statusDot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#555;
}

.status.online .statusDot{
    background:#65e6a1;
    box-shadow:0 0 9px rgba(101,230,161,.65);
}

.status.offline .statusDot{
    background:#ff6868;
}

/* =========================
   CHAT
========================= */

.messages{
    flex:1;
    overflow-y:auto;
    padding:35px 20px 130px;
    scroll-behavior:smooth;
}

.messages::-webkit-scrollbar,
.chatList::-webkit-scrollbar{
    width:5px;
}

.messages::-webkit-scrollbar-thumb,
.chatList::-webkit-scrollbar-thumb{
    background:#222;
    border-radius:10px;
}

.welcome{
    max-width:760px;
    margin:7vh auto 0;
    text-align:center;
    animation:welcomeIn .8s cubic-bezier(.16,1,.3,1);
}

@keyframes welcomeIn{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.welcomeLogo{
    position:relative;
    width:82px;
    height:82px;
    margin:0 auto 20px;
}

.welcomeLogo::before{
    content:"";
    position:absolute;
    inset:-13px;
    border-radius:50%;
    border:1px solid rgba(91,220,255,.3);
    animation:ringSpin 8s linear infinite;
}

@keyframes ringSpin{
    to{transform:rotate(360deg);}
}

.welcomeLogo img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    border:2px solid var(--yellow);
    box-shadow:0 0 35px rgba(255,240,0,.16);
}

.welcome h1{
    font-size:32px;
    letter-spacing:-1px;
}

.welcome h1 span{
    color:var(--yellow);
}

.welcome p{
    color:#777;
    font-size:14px;
    margin-top:9px;
}

.suggestions{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:28px;
}

.suggestion{
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.025);
    color:#999;
    border-radius:12px;
    padding:10px 13px;
    cursor:pointer;
    font-size:12px;
    transition:.2s;
}

.suggestion:hover{
    color:var(--yellow);
    border-color:rgba(255,240,0,.2);
    transform:translateY(-2px);
}

/* MENSAJES */

.message{
    width:min(850px,100%);
    margin:0 auto 22px;
    display:flex;
    gap:12px;
    animation:messageIn .35s ease both;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.avatar{
    flex-shrink:0;
    width:30px;
    height:30px;
    border-radius:50%;
    overflow:hidden;
    border:1px solid rgba(255,240,0,.35);
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.message.user .avatar{
    border-color:rgba(91,220,255,.4);
}

.bubble{
    max-width:calc(100% - 45px);
    line-height:1.6;
    font-size:14px;
    color:#ddd;
    min-width:0;
}

.message.user .bubble{
    padding:11px 14px;
    border-radius:15px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.06);
    color:#eee;
}

.message.ai .bubble{
    padding-top:3px;
}

.bubble pre{
    margin:12px 0;
    padding:15px;
    overflow-x:auto;
    border-radius:12px;
    background:#050505;
    border:1px solid rgba(255,240,0,.14);
    position:relative;
}

.bubble code{
    font-family:Consolas,monospace;
    font-size:12px;
    color:#ddd;
}

.codeHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
    color:#666;
    font-size:10px;
}

.copyCode{
    border:0;
    background:transparent;
    color:#777;
    cursor:pointer;
    font-size:10px;
}

.copyCode:hover{
    color:var(--yellow);
}

/* CURSOR */
.typing-cursor{
    display:inline-block;
    width:6px;
    height:16px;
    margin-left:3px;
    vertical-align:-3px;
    background:var(--yellow);
    box-shadow:0 0 8px rgba(255,240,0,.7);
    animation:cursorBlink .7s infinite;
}

@keyframes cursorBlink{
    0%,45%{opacity:1;}
    46%,100%{opacity:0;}
}

/* THINKING */
.thinking{
    display:flex;
    gap:4px;
    padding:5px 0;
}

.thinking span{
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--yellow);
    animation:thinking .8s infinite;
}

.thinking span:nth-child(2){animation-delay:.12s;}
.thinking span:nth-child(3){animation-delay:.24s;}

@keyframes thinking{
    0%,60%,100%{
        opacity:.25;
        transform:translateY(0);
    }
    30%{
        opacity:1;
        transform:translateY(-4px);
    }
}

/* =========================
   INPUT
========================= */

.inputArea{
    position:absolute;
    bottom:0;
    left:270px;
    right:0;
    padding:20px;
    background:linear-gradient(
        to top,
        rgba(3,3,3,1) 55%,
        rgba(3,3,3,0)
    );
}

.inputWrap{
    width:min(850px,100%);
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:7px;
    border:1px solid rgba(255,255,255,.09);
    border-radius:17px;
    background:rgba(8,8,8,.9);
    box-shadow:
        0 10px 40px rgba(0,0,0,.45),
        0 0 25px rgba(255,240,0,.025);
    backdrop-filter:blur(16px);
    transition:.25s;
}

.inputWrap:focus-within{
    border-color:rgba(255,240,0,.28);
    box-shadow:
        0 10px 40px rgba(0,0,0,.45),
        0 0 25px rgba(255,240,0,.06);
}

textarea{
    flex:1;
    resize:none;
    min-height:40px;
    max-height:150px;
    padding:10px 9px;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    font-size:14px;
    line-height:20px;
}

textarea::placeholder{
    color:#555;
}

.sendBtn,
.aiBtn{
    width:40px;
    height:40px;
    flex-shrink:0;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:.2s;
}

.aiBtn{
    border:1px solid rgba(91,220,255,.18);
    background:rgba(91,220,255,.04);
    color:#777;
}

.aiBtn:hover{
    color:var(--cyan);
    border-color:rgba(91,220,255,.45);
    background:rgba(91,220,255,.08);
}

.sendBtn{
    border:1px solid rgba(255,240,0,.35);
    background:rgba(255,240,0,.08);
    color:var(--yellow);
}

.sendBtn:hover{
    background:var(--yellow);
    color:#000;
    box-shadow:0 0 20px rgba(255,240,0,.18);
    transform:translateY(-1px);
}

.sendBtn:disabled{
    opacity:.3;
    cursor:not-allowed;
    transform:none;
}

.sendBtn svg,
.aiBtn svg{
    width:18px;
    height:18px;
}

/* =========================
   OVERLAY / CONFIRM
========================= */

.overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.68);
    backdrop-filter:blur(7px);
    z-index:50;
    align-items:center;
    justify-content:center;
}

.confirm{
    width:min(360px,90%);
    background:#090909;
    border:1px solid rgba(255,240,0,.18);
    border-radius:18px;
    padding:24px;
    box-shadow:0 20px 80px rgba(0,0,0,.6);
    animation:confirmIn .25s ease;
}

@keyframes confirmIn{
    from{
        opacity:0;
        transform:scale(.95);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.confirm h3{
    font-size:17px;
}

.confirm p{
    color:#777;
    font-size:13px;
    margin-top:8px;
    line-height:1.5;
}

.confirmActions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:20px;
}

.confirmActions button{
    padding:9px 14px;
    border-radius:9px;
    cursor:pointer;
    font-size:12px;
}

.cancel{
    border:1px solid #222;
    background:#111;
    color:#aaa;
}

.delete{
    border:1px solid rgba(255,80,80,.25);
    background:rgba(255,80,80,.06);
    color:#ff7777;
}

/* =========================
   MOBILE
========================= */

@media(max-width:760px){

    .sidebar{
        position:fixed;
        left:0;
        top:0;
        bottom:0;
        transform:translateX(-105%);
        box-shadow:20px 0 60px rgba(0,0,0,.5);
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .menuBtn{
        display:flex;
    }

    .inputArea{
        left:0;
        padding:12px;
    }

    .header{
        padding:0 10px;
    }

    .messages{
        padding:25px 12px 115px;
    }

    .welcome{
        margin-top:5vh;
    }

    .welcome h1{
        font-size:27px;
    }

    .suggestions{
        gap:6px;
    }

    .suggestion{
        font-size:11px;
    }

    .status{
        display:none;
    }

    .bubble{
        font-size:13px;
    }

    .message{
        gap:8px;
    }

    .avatar{
        width:27px;
        height:27px;
    }

    .inputWrap{
        border-radius:15px;
    }
}

/* REDUCE MOTION */
@media(prefers-reduced-motion:reduce){
    *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        scroll-behavior:auto!important;
    }
}
</style>
</head>

<body>

<div class="background">
    <div class="grid"></div>
    <div class="glow yellow"></div>
    <div class="glow cyan"></div>
</div>

<div class="app">

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">

    <div class="sidebarTop">
        <div class="brand">
            <img src="https://i.ibb.co/whKQvZsw/Nova.jpg">
            <span>NOVA <span>IA</span></span>
        </div>

        <button class="iconBtn" onclick="closeSidebar()" aria-label="Cerrar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round">
                <path d="M18 6 6 18"></path>
                <path d="m6 6 12 12"></path>
            </svg>
        </button>
    </div>

    <button class="newChat" onclick="newChat()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round">
            <path d="M12 5v14"></path>
            <path d="M5 12h14"></path>
        </svg>
        Nueva conversación
    </button>

    <div class="chatTitle">Mis chats</div>

    <div class="chatList" id="chatList"></div>

    <div class="sidebarBottom">
        <div class="creator">
            Creada por <span>Yander</span>
        </div>
    </div>

</aside>

<!-- MAIN -->
<main class="main">

    <header class="header">

        <button class="iconBtn menuBtn" onclick="openSidebar()" aria-label="Menú">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round">
                <path d="M4 6h16"></path>
                <path d="M4 12h16"></path>
                <path d="M4 18h16"></path>
            </svg>
        </button>

        <img class="headerLogo" src="https://i.ibb.co/whKQvZsw/Nova.jpg">

        <div class="headerName">
            NOVA <span>IA</span>
        </div>

        <div class="status" id="serverStatus">
            <span class="statusDot"></span>
            <span id="statusText">Conectando...</span>
        </div>

    </header>

    <section class="messages" id="messages">

        <div class="welcome" id="welcome">

            <div class="welcomeLogo">
                <img src="https://i.ibb.co/whKQvZsw/Nova.jpg">
            </div>

            <h1>¿En qué puedo <span>ayudarte?</span></h1>

            <p>
                Programación, Roblox, Lua y mucho más.
            </p>

            <div class="suggestions">
                <button class="suggestion"
                    onclick="useSuggestion('Créame un script de Roblox en Lua')">
                    Script de Roblox
                </button>

                <button class="suggestion"
                    onclick="useSuggestion('Explícame este código')">
                    Explicar código
                </button>

                <button class="suggestion"
                    onclick="useSuggestion('Ayúdame a crear una GUI para Roblox')">
                    Crear una GUI
                </button>
            </div>

        </div>

    </section>

</main>

<!-- INPUT -->
<div class="inputArea">

    <div class="inputWrap">

        <textarea
            id="input"
            rows="1"
            placeholder="Escribe un mensaje..."
            autocomplete="off"
        ></textarea>

        <!-- SELECTOR PREPARADO PARA DESPUÉS -->
        <button class="aiBtn"
                onclick="openAISelector()"
                title="Seleccionar IA">

            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor"
                 stroke-width="1.8"
                 stroke-linecap="round"
                 stroke-linejoin="round">

                <path d="m12 3 1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7L12 3Z"></path>
                <path d="m19 15 .8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15Z"></path>

            </svg>

        </button>

        <button class="sendBtn"
                id="sendBtn"
                onclick="sendMessage()"
                title="Enviar">

            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">

                <path d="M22 2 11 13"></path>
                <path d="m22 2-7 20-4-9-9-4Z"></path>

            </svg>

        </button>

    </div>

</div>

</div>

<!-- CONFIRM -->
<div class="overlay" id="confirmOverlay">

    <div class="confirm">

        <h3>Eliminar conversación</h3>

        <p>
            Esta conversación se eliminará de este dispositivo.
        </p>

        <div class="confirmActions">

            <button class="cancel" onclick="closeNovaConfirm()">
                Cancelar
            </button>

            <button class="delete" id="confirmDeleteBtn">
                Eliminar
            </button>

        </div>

    </div>

</div>

<script>
const RENDER_URL = "https://nova-ia-2oup.onrender.com";
const CHAT_URL = RENDER_URL + "/chat";
const STATUS_URL = RENDER_URL + "/status";

const STORAGE_KEY = "nova_chats";
const CURRENT_KEY = "nova_current";

let chats = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
let currentId = localStorage.getItem(CURRENT_KEY);
let waiting = false;
let deleteTarget = null;

/* =========================
   STORAGE
========================= */

function save(){
    localStorage.setItem(STORAGE_KEY,JSON.stringify(chats));

    if(currentId){
        localStorage.setItem(CURRENT_KEY,currentId);
    }
}

function currentChat(){
    return chats.find(c => c.id === currentId);
}

/* =========================
   CHAT
========================= */

function createChat(){
    const chat = {
        id:Date.now().toString(),
        title:"Nueva conversación",
        messages:[]
    };

    chats.unshift(chat);
    currentId = chat.id;

    save();
    renderChatList();
    render();
}

function newChat(){
    createChat();
    closeSidebar();
}

function generateTitle(text){
    let title = text.trim().replace(/\s+/g," ");

    if(title.length > 30){
        title = title.substring(0,30) + "...";
    }

    return title || "Nueva conversación";
}

/* =========================
   RENDER
========================= */

function render(){

    const container = document.getElementById("messages");
    const chat = currentChat();

    container.innerHTML="";

    if(!chat || chat.messages.length === 0){

        container.innerHTML = `
        <div class="welcome" id="welcome">

            <div class="welcomeLogo">
                <img src="https://i.ibb.co/whKQvZsw/Nova.jpg">
            </div>

            <h1>¿En qué puedo <span>ayudarte?</span></h1>

            <p>
                Programación, Roblox, Lua y mucho más.
            </p>

            <div class="suggestions">

                <button class="suggestion"
                    onclick="useSuggestion('Créame un script de Roblox en Lua')">
                    Script de Roblox
                </button>

                <button class="suggestion"
                    onclick="useSuggestion('Explícame este código')">
                    Explicar código
                </button>

                <button class="suggestion"
                    onclick="useSuggestion('Ayúdame a crear una GUI para Roblox')">
                    Crear una GUI
                </button>

            </div>

        </div>`;

        return;
    }

    chat.messages.forEach(message=>{
        addMessage(message.role,message.content,false);
    });

    scrollBottom();
}

function addMessage(role,content,animate=true){

    const container = document.getElementById("messages");

    const message = document.createElement("div");
    message.className = "message " + role;

    if(!animate){
        message.style.animation="none";
    }

    message.innerHTML = `
        <div class="avatar">
            <img src="https://i.ibb.co/whKQvZsw/Nova.jpg">
        </div>

        <div class="bubble"></div>
    `;

    const bubble = message.querySelector(".bubble");

    if(role === "user"){
        bubble.textContent = content;
    }else{
        renderFormattedContent(bubble,content);
    }

    container.appendChild(message);

    return bubble;
}

/* =========================
   FORMATO DE RESPUESTAS
========================= */

function renderFormattedContent(container,content){

    if(!content.includes("```")){
        container.textContent = content;
        return;
    }

    const parts = content.split("```");

    container.innerHTML="";

    parts.forEach((part,index)=>{

        if(index % 2 === 0){

            if(part.trim()){
                const text = document.createElement("div");
                text.textContent = part;
                container.appendChild(text);
            }

        }else{

            let code = part;

            let language = "Código";

            const firstLine = code.split("\n")[0].trim();

            if(
                firstLine === "lua" ||
                firstLine === "javascript" ||
                firstLine === "js" ||
                firstLine === "html" ||
                firstLine === "css" ||
                firstLine === "python"
            ){
                language = firstLine;
                code = code.substring(code.indexOf("\n")+1);
            }

            const wrapper = document.createElement("div");

            wrapper.innerHTML = `
                <pre>
                    <div class="codeHeader">
                        <span>${escapeHTML(language)}</span>

                        <button class="copyCode">
                            Copiar
                        </button>
                    </div>

                    <code>${escapeHTML(code.trim())}</code>
                </pre>
            `;

            const copyButton = wrapper.querySelector(".copyCode");

            copyButton.onclick = async ()=>{

                try{
                    await navigator.clipboard.writeText(code.trim());

                    copyButton.textContent="Copiado";

                    setTimeout(()=>{
                        copyButton.textContent="Copiar";
                    },1200);

                }catch{
                    copyButton.textContent="Error";
                }

            };

            container.appendChild(wrapper);
        }

    });
}

/* =========================
   ESCRITURA PROGRESIVA
========================= */

async function typeResponse(bubble,content){

    const cursor = document.createElement("span");
    cursor.className="typing-cursor";

    bubble.appendChild(cursor);

    let text="";

    /*
      Velocidad:
      4 = muy rápida
      7 = normal
      12 = lenta
    */

    const speed = 7;

    for(let i=0;i<content.length;i++){

        text += content[i];

        cursor.remove();

        bubble.textContent=text;

        bubble.appendChild(cursor);

        scrollBottom();

        await new Promise(resolve =>
            setTimeout(resolve,speed)
        );
    }

    cursor.remove();

    bubble.innerHTML="";

    renderFormattedContent(bubble,content);

    scrollBottom();
}

/* =========================
   THINKING
========================= */

function showThinking(){

    const container = document.getElementById("messages");

    const message = document.createElement("div");

    message.className="message ai";
    message.id="thinking";

    message.innerHTML=`
        <div class="avatar">
            <img src="https://i.ibb.co/whKQvZsw/Nova.jpg">
        </div>

        <div class="bubble">

            <div class="thinking">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>
    `;

    container.appendChild(message);

    scrollBottom();
}

function removeThinking(){

    const thinking = document.getElementById("thinking");

    if(thinking){
        thinking.remove();
    }
}

/* =========================
   SEND
========================= */

async function sendMessage(){

    if(waiting) return;

    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");

    const message = input.value.trim();

    if(!message) return;

    let chat = currentChat();

    if(!chat){
        createChat();
        chat = currentChat();
    }

    if(chat.messages.length === 0){
        chat.title = generateTitle(message);
    }

    chat.messages.push({
        role:"user",
        content:message
    });

    save();

    input.value="";
    autoResize();

    render();

    waiting=true;
    sendBtn.disabled=true;

    showThinking();

    try{

        const response = await fetch(CHAT_URL,{
            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                message:message,
                history:chat.messages
            })
        });

        removeThinking();

        const data = await response.json();

        if(!data.success){
            throw new Error(data.error || "Error del servidor");
        }

        const bubble = addMessage("ai","",true);

        chat.messages.push({
            role:"assistant",
            content:data.response
        });

        save();

        await typeResponse(bubble,data.response);

    }catch(error){

        removeThinking();

        const errorText =
            "No pude obtener una respuesta de Nova IA.\n\nDetalle: "
            + error.message;

        addMessage("ai",errorText,true);

        chat.messages.push({
            role:"assistant",
            content:errorText
        });

        save();

    }finally{

        waiting=false;
        sendBtn.disabled=false;

        renderChatList();
    }
}

/* =========================
   SUGERENCIAS
========================= */

function useSuggestion(text){

    const input = document.getElementById("input");

    input.value=text;

    autoResize();

    input.focus();
}

/* =========================
   CHAT LIST
========================= */

function renderChatList(){

    const list = document.getElementById("chatList");

    list.innerHTML="";

    chats.forEach(chat=>{

        const item = document.createElement("div");

        item.className =
            "chatItem " +
            (chat.id === currentId ? "active" : "");

        item.textContent = chat.title;

        item.onclick=()=>{

            currentId=chat.id;

            save();
            render();
            renderChatList();

            closeSidebar();
        };

        item.oncontextmenu=(event)=>{

            event.preventDefault();

            confirmNovaDelete(chat.id);
        };

        list.appendChild(item);
    });
}

/* =========================
   DELETE
========================= */

function confirmNovaDelete(id){

    deleteTarget=id;

    document.getElementById("confirmOverlay").style.display="flex";

    document.getElementById("confirmDeleteBtn").onclick=()=>{

        deleteChat(deleteTarget);

        closeNovaConfirm();
    };
}

function closeNovaConfirm(){

    deleteTarget=null;

    document.getElementById("confirmOverlay").style.display="none";
}

function deleteChat(id){

    chats=chats.filter(chat=>chat.id!==id);

    if(currentId===id){

        if(chats.length){
            currentId=chats[0].id;
        }else{
            currentId=null;
        }
    }

    save();

    if(!currentId){
        createChat();
    }else{
        render();
        renderChatList();
    }
}

/* =========================
   SIDEBAR
========================= */

function openSidebar(){

    document.getElementById("sidebar")
        .classList.add("open");
}

function closeSidebar(){

    document.getElementById("sidebar")
        .classList.remove("open");
}

/* =========================
   SERVER STATUS
========================= */

async function checkServer(){

    const status = document.getElementById("serverStatus");
    const statusText = document.getElementById("statusText");

    try{

        const response = await fetch(
            STATUS_URL,
            {
                method:"GET",
                cache:"no-store"
            }
        );

        if(!response.ok){
            throw new Error();
        }

        status.classList.remove("offline");
        status.classList.add("online");

        statusText.textContent="Online";

    }catch{

        status.classList.remove("online");
        status.classList.add("offline");

        statusText.textContent="Offline";
    }
}

/* =========================
   UTILIDADES
========================= */

function escapeHTML(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function scrollBottom(){

    const container=document.getElementById("messages");

    requestAnimationFrame(()=>{
        container.scrollTop=container.scrollHeight;
    });
}

function autoResize(){

    const input=document.getElementById("input");

    input.style.height="auto";

    input.style.height =
        Math.min(input.scrollHeight,150) + "px";
}

/* =========================
   TECLADO
========================= */

const input=document.getElementById("input");

input.addEventListener("input",autoResize);

input.addEventListener("keydown",event=>{

    if(event.key==="Enter" && !event.shiftKey){

        event.preventDefault();

        sendMessage();
    }
});

/* =========================
   CLICK FUERA SIDEBAR
========================= */

document.addEventListener("click",event=>{

    if(window.innerWidth > 760) return;

    const sidebar=document.getElementById("sidebar");

    if(
        sidebar.classList.contains("open") &&
        !sidebar.contains(event.target) &&
        !event.target.closest(".menuBtn")
    ){
        closeSidebar();
    }
});

/* =========================
   INICIO
========================= */

if(!chats.length){

    createChat();

}else{

    if(!currentId || !currentChat()){
        currentId=chats[0].id;
        save();
    }

    render();
    renderChatList();
}

checkServer();
</script>
