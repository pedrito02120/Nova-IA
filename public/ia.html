<!DOCTYPE html><html lang="es">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Nova IA</title><style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    background:
        radial-gradient(
            circle at 50% 0%,
            #4a0000,
            #150000 35%,
            #020202 75%
        );

    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
}


/* FONDO */

.background-lights{

    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.light{

    position:absolute;

    width:350px;
    height:350px;

    border-radius:50%;

    border:2px solid rgba(255,0,0,.18);

    animation:
        moveLight 6s linear infinite;
}

.light:nth-child(2){

    width:520px;
    height:520px;

    animation-delay:-3s;
    opacity:.45;
}

@keyframes moveLight{

    0%{
        transform:
            rotate(0deg)
            translateX(100px);

        opacity:.12;
    }

    50%{
        opacity:.5;
    }

    100%{

        transform:
            rotate(360deg)
            translateX(100px);

        opacity:.12;
    }
}


/* APP */

.app{

    position:relative;
    z-index:2;

    height:100vh;

    display:flex;
    flex-direction:column;
}


/* HEADER */

.header{

    height:64px;
    flex-shrink:0;

    display:flex;
    align-items:center;
    gap:12px;

    padding:0 15px;

    background:rgba(5,0,0,.82);

    backdrop-filter:blur(14px);

    border-bottom:
        1px solid rgba(255,0,0,.20);

    z-index:10;
}

.menu-btn,
.delete-btn{

    width:40px;
    height:40px;

    border:none;
    border-radius:10px;

    background:rgba(25,0,0,.75);

    color:#aaa;

    font-size:20px;

    cursor:pointer;

    transition:.2s;
}

.menu-btn:hover,
.delete-btn:hover{

    color:white;
    background:#280000;
}

.menu-btn{

    font-size:24px;
    line-height:1;
}

.delete-btn{
    font-size:18px;
}


/* LOGO */

.logo-small{

    width:38px;
    height:38px;

    border-radius:50%;
    overflow:hidden;

    border:1px solid #ff2525;

    box-shadow:
        0 0 14px rgba(255,0,0,.35);

    flex-shrink:0;
}

.logo-small img{

    width:100%;
    height:100%;

    object-fit:cover;
}


/* TITULO */

.title{
    flex:1;
}

.title h1{

    font-size:17px;
    font-weight:600;
}

.title p{

    color:#777;
    font-size:11px;
    margin-top:3px;
}


/* CHAT */

.chat{

    flex:1;

    overflow-y:auto;

    padding:
        35px 15px 110px;

    scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
    width:6px;
}

.chat::-webkit-scrollbar-track{
    background:transparent;
}

.chat::-webkit-scrollbar-thumb{

    background:#3d0000;
    border-radius:10px;
}

.chat::-webkit-scrollbar-thumb:hover{
    background:#650000;
}

.messages{

    max-width:850px;
    margin:auto;
}


/* BIENVENIDA */

.welcome-message{

    display:flex;
    flex-direction:column;

    align-items:center;
    text-align:center;

    padding:
        25px 10px 45px;
}


/* LOGO GRANDE */

.logo-container{

    position:relative;

    width:145px;
    height:145px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:25px;
}

.big-logo{

    width:105px;
    height:105px;

    border-radius:50%;
    overflow:hidden;

    border:
        2px solid rgba(255,50,50,.75);

    box-shadow:
        0 0 25px rgba(255,0,0,.4);

    position:relative;
    z-index:2;
}

.big-logo img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.logo-ring{

    position:absolute;

    width:130px;
    height:130px;

    border-radius:50%;

    border:2px solid transparent;

    border-top-color:#ff2020;
    border-right-color:#ff5555;

    animation:
        ringSpin 2s linear infinite;

    filter:
        drop-shadow(
            0 0 7px #ff0000
        );

    z-index:1;
}

.logo-glow{

    position:absolute;

    width:165px;
    height:165px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,0,0,.22),
            transparent 70%
        );

    animation:
        glowPulse 2.5s ease-in-out infinite;
}

@keyframes ringSpin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

@keyframes glowPulse{

    0%,100%{

        transform:scale(.82);
        opacity:.25;
    }

    50%{

        transform:scale(1.08);
        opacity:.65;
    }
}


/* TEXTO */

.welcome-message h2{

    font-size:29px;
    margin-bottom:12px;
    font-weight:600;
}

.welcome-message h2 span{

    color:#ff2929;

    text-shadow:
        0 0 18px rgba(255,0,0,.45);
}

.welcome-description{

    max-width:570px;

    color:#999;

    font-size:14px;
    line-height:1.7;

    margin-bottom:22px;
}


/* SUGERENCIAS */

.suggestions{

    display:flex;
    justify-content:center;

    flex-wrap:wrap;
    gap:7px;
}

.suggestion{

    padding:
        7px 12px;

    border-radius:16px;

    background:
        rgba(50,0,0,.3);

    border:
        1px solid #351010;

    color:#999;

    font-size:11px;

    transition:.2s;
}

.suggestion:hover{

    color:#ff6666;
    border-color:#700000;
}


/* MENSAJES */

.message{

    display:flex;

    gap:10px;

    margin-bottom:20px;

    animation:
        messageAppear .25s ease;
}

@keyframes messageAppear{

    from{

        opacity:0;

        transform:
            translateY(8px);
    }

    to{

        opacity:1;

        transform:
            translateY(0);
    }
}

.message.user{
    justify-content:flex-end;
}


/* AVATAR */

.avatar{

    width:34px;
    height:34px;

    flex-shrink:0;

    border-radius:50%;
    overflow:hidden;

    border:
        1px solid #7a1616;

    box-shadow:
        0 0 9px rgba(255,0,0,.2);
}

.avatar img{

    width:100%;
    height:100%;

    object-fit:cover;
}


/* BURBUJAS */

.bubble{

    max-width:80%;

    padding:
        12px 15px;

    border-radius:15px;

    line-height:1.55;

    white-space:pre-wrap;

    word-wrap:break-word;

    font-size:14px;
}

.message.ai .bubble{

    background:
        rgba(20,0,0,.78);

    border:
        1px solid #300808;

    border-top-left-radius:4px;

    backdrop-filter:blur(8px);
}

.message.user .bubble{

    background:
        linear-gradient(
            135deg,
            #9d0000,
            #500000
        );

    border:
        1px solid #a31515;

    border-top-right-radius:4px;
}


/* CODIGO */

.code-wrapper{

    position:relative;

    width:100%;

    margin:10px 0;

    border:
        1px solid #330808;

    border-radius:10px;

    background:#070000;

    overflow:hidden;

    box-shadow:
        0 0 15px rgba(255,0,0,.06);
}

.code-header{

    height:38px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 10px;

    background:#110000;

    border-bottom:
        1px solid #2d0808;

    color:#888;

    font-size:11px;
}

.copy-code{

    border:
        1px solid #401010;

    border-radius:6px;

    padding:
        5px 9px;

    background:#190000;

    color:#aaa;

    cursor:pointer;

    font-size:11px;

    transition:.2s;
}

.copy-code:hover{

    color:white;

    border-color:#750000;

    background:#280000;
}

.code-content{

    max-height:280px;

    overflow:auto;

    padding:14px;

    margin:0;

    color:#e5e5e5;

    font-family:
        "Courier New",
        monospace;

    font-size:13px;
    line-height:1.5;

    white-space:pre;

    tab-size:4;
}

.code-content::-webkit-scrollbar{

    width:6px;
    height:6px;
}

.code-content::-webkit-scrollbar-track{
    background:#070000;
}

.code-content::-webkit-scrollbar-thumb{

    background:#4d0000;
    border-radius:10px;
}


/* PENSANDO */

.thinking{

    display:flex;

    gap:5px;

    padding:
        12px 15px;

    background:
        rgba(25,0,0,.8);

    border:
        1px solid #300808;

    border-radius:15px;
}

.dot{

    width:6px;
    height:6px;

    background:#ff3333;

    border-radius:50%;

    animation:
        dot 1.2s infinite;
}

.dot:nth-child(2){
    animation-delay:.2s;
}

.dot:nth-child(3){
    animation-delay:.4s;
}

@keyframes dot{

    0%,60%,100%{

        transform:
            translateY(0);

        opacity:.3;
    }

    30%{

        transform:
            translateY(-4px);

        opacity:1;
    }
}


/* INPUT */

.input-area{

    position:fixed;

    bottom:0;
    left:0;
    right:0;

    padding:
        12px 15px 15px;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.95) 40%
        );

    z-index:5;
}

.input-box{

    max-width:850px;

    margin:auto;

    display:flex;

    gap:8px;

    padding:7px;

    background:
        rgba(15,0,0,.9);

    border:
        1px solid #350808;

    border-radius:15px;

    backdrop-filter:blur(12px);

    transition:.2s;
}

.input-box:focus-within{

    border-color:#650000;

    box-shadow:
        0 0 18px rgba(255,0,0,.08);
}

textarea{

    flex:1;

    min-height:44px;
    max-height:130px;

    resize:none;

    border:none;
    outline:none;

    background:transparent;

    color:white;

    padding:11px;

    font-size:14px;

    font-family:Arial,sans-serif;
}

textarea::placeholder{
    color:#666;
}

.send-btn{

    width:42px;
    height:42px;

    border:
        1px solid #720000;

    border-radius:10px;

    background:#790000;

    color:white;

    font-size:18px;

    cursor:pointer;

    transition:.2s;
}

.send-btn:hover{

    background:#a00000;

    box-shadow:
        0 0 15px rgba(255,0,0,.25);
}

.send-btn:active{
    transform:scale(.94);
}


/* SIDEBAR */

.sidebar{

    position:fixed;

    top:0;
    bottom:0;
    left:0;

    width:290px;

    background:
        rgba(9,0,0,.96);

    backdrop-filter:blur(18px);

    border-right:
        1px solid #520000;

    z-index:20;

    transform:
        translateX(-100%);

    transition:.25s;

    overflow:hidden;
}

.sidebar.open{

    transform:
        translateX(0);
}

.sidebar-header{

    height:64px;

    display:flex;
    align-items:center;

    padding:
        0 15px;

    border-bottom:
        1px solid #280606;
}

.sidebar-title{

    flex:1;

    font-weight:600;
    font-size:14px;
}

.close-sidebar{

    background:none;
    border:none;

    color:#777;

    font-size:25px;

    cursor:pointer;
}

.close-sidebar:hover{
    color:white;
}


/* LOGO SIDEBAR */

.sidebar-logo-area{

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    padding:
        18px 10px 8px;
}

.menu-logo-container{

    position:relative;

    width:110px;
    height:110px;

    display:flex;

    align-items:center;
    justify-content:center;
}

.menu-logo{

    width:76px;
    height:76px;

    border-radius:50%;

    overflow:hidden;

    border:
        1px solid #8b1515;

    box-shadow:
        0 0 20px rgba(255,0,0,.35);

    z-index:2;
}

.menu-logo img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.menu-ring{

    position:absolute;

    width:98px;
    height:98px;

    border-radius:50%;

    border:
        2px solid transparent;

    border-top-color:#ff2020;
    border-right-color:#ff5555;

    animation:
        ringSpin 2s linear infinite;
}

.menu-glow{

    position:absolute;

    width:125px;
    height:125px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,0,0,.20),
            transparent 70%
        );

    animation:
        glowPulse 2.5s infinite;
}

.menu-logo-name{

    margin-top:2px;

    font-size:19px;
    font-weight:600;

    color:#e52b2b;
}


/* BOTONES SIDEBAR */

.new-chat{

    margin:
        8px 15px;

    width:
        calc(100% - 30px);

    padding:11px;

    border:
        1px solid #3b0b0b;

    border-radius:9px;

    background:#190000;

    color:#aaa;

    cursor:pointer;

    transition:.2s;
}

.new-chat:hover{

    color:white;

    border-color:#700000;

    background:#250000;
}


/* LISTA */

.chat-list{

    padding:
        0 12px 30px;

    overflow-y:auto;

    height:
        calc(100vh - 270px);
}

.chat-list::-webkit-scrollbar{
    width:5px;
}

.chat-list::-webkit-scrollbar-thumb{

    background:#450000;
    border-radius:10px;
}

.chat-item{

    padding:11px;

    border-radius:8px;

    margin-bottom:5px;

    color:#999;

    cursor:pointer;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;

    border:
        1px solid transparent;

    font-size:13px;
}

.chat-item:hover{

    background:#190000;
    color:#ddd;
}

.chat-item.selected{

    background:#250000;

    border-color:#650000;

    color:white;
}

.delete-mode{
    color:#ff5555;
}

.delete-chat{

    float:right;
    color:#ff5555;
}


/* OVERLAY */

.overlay{

    position:fixed;
    inset:0;

    background:
        rgba(0,0,0,.6);

    backdrop-filter:
        blur(2px);

    z-index:19;

    display:none;
}

.overlay.show{
    display:block;
}


/* CONFIRMACION */

.nova-confirm-overlay{

    position:fixed;
    inset:0;

    background:
        rgba(0,0,0,.72);

    backdrop-filter:
        blur(7px);

    display:flex;

    align-items:center;
    justify-content:center;

    z-index:9999;

    opacity:0;

    pointer-events:none;

    transition:.25s;
}

.nova-confirm-overlay.show{

    opacity:1;

    pointer-events:auto;
}

.nova-confirm{

    position:relative;

    width:
        calc(100% - 40px);

    max-width:360px;

    padding:
        26px 22px;

    border-radius:16px;

    background:#100000;

    border:
        1px solid #500000;

    box-shadow:
        0 0 35px rgba(255,0,0,.18);

    transform:
        scale(.9)
        translateY(12px);

    transition:.3s;
}

.nova-confirm-overlay.show
.nova-confirm{

    transform:
        scale(1)
        translateY(0);
}

.nova-confirm-logo{

    width:60px;
    height:60px;

    margin:
        0 auto 15px;

    border-radius:50%;

    overflow:hidden;

    border:
        1px solid #8b1515;

    box-shadow:
        0 0 18px rgba(255,0,0,.3);
}

.nova-confirm-logo img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.nova-confirm h3{

    text-align:center;

    color:white;

    font-size:19px;

    margin-bottom:8px;

    font-weight:600;
}

.nova-confirm h3 span{
    color:#ff2929;
}

.nova-confirm p{

    text-align:center;

    color:#888;

    font-size:12px;

    line-height:1.6;

    margin-bottom:20px;
}

.nova-confirm-buttons{

    display:flex;

    gap:9px;
}

.nova-confirm-buttons button{

    flex:1;

    padding:10px;

    border-radius:9px;

    color:white;

    cursor:pointer;

    font-weight:600;

    transition:.2s;
}

.nova-cancel{

    background:#180000;

    border:
        1px solid #3d1010;
}

.nova-cancel:hover{
    background:#250000;
}

.nova-delete{

    border:
        1px solid #790000;

    background:#720000;
}

.nova-delete:hover{
    background:#980000;
}


/* MOVIL */

@media(max-width:500px){

    .header{
        padding:0 10px;
    }

    .title h1{
        font-size:16px;
    }

    .title p{
        font-size:10px;
    }

    .welcome-message h2{
        font-size:24px;
    }

    .welcome-description{
        font-size:13px;
    }

    .logo-container{

        width:125px;
        height:125px;
    }

    .big-logo{

        width:92px;
        height:92px;
    }

    .logo-ring{

        width:115px;
        height:115px;
    }

    .logo-glow{

        width:145px;
        height:145px;
    }

    .bubble{

        max-width:86%;
        font-size:13px;
    }

    .code-content{

        max-height:230px;
        font-size:12px;
    }

    .sidebar{
        width:280px;
    }
}


/* REDUCIR ANIMACIONES */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

        scroll-behavior:auto !important;
    }
}

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const RENDER_URL =
    "https://nova-ia-2oup.onrender.com";

const CHAT_URL =
    RENDER_URL + "/chat";

const STATUS_URL =
    RENDER_URL + "/status";

const STORAGE_KEY =
    "nova_chats";

const CURRENT_KEY =
    "nova_current";


let chats =
    JSON.parse(
        localStorage.getItem(
            STORAGE_KEY
        ) || "[]"
    );

let currentId =
    localStorage.getItem(
        CURRENT_KEY
    );

let deleteMode = false;


/* =========================================================
   GUARDAR
========================================================= */

function save(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(chats)
    );

    if(currentId){

        localStorage.setItem(
            CURRENT_KEY,
            currentId
        );

    }
}


/* =========================================================
   CREAR CHAT
========================================================= */

function createChat(){

    const chat = {

        id:
            Date.now().toString(),

        title:
            "Nuevo chat",

        messages:[]

    };

    chats.unshift(chat);

    currentId =
        chat.id;

    save();
}


/* =========================================================
   CHAT ACTUAL
========================================================= */

function currentChat(){

    return chats.find(
        chat =>
            chat.id === currentId
    );
}


/* =========================================================
   RENDER
========================================================= */

function render(){

    const box =
        document.getElementById(
            "messages"
        );

    const welcome =
        box.querySelector(
            ".welcome-message"
        );

    box.innerHTML = "";

    if(welcome){

        box.appendChild(
            welcome
        );

    }

    const chat =
        currentChat();

    if(!chat){

        return;

    }

    chat.messages.forEach(
        message => {

            addMessage(
                message.role,
                message.content
            );

        }
    );

    renderChatList();

    scrollBottom();
}


/* =========================================================
   MENSAJES
========================================================= */

function addMessage(
    role,
    content
){

    const box =
        document.getElementById(
            "messages"
        );

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message " +
        (
            role === "user"
                ?
                "user"
                :
                "ai"
        );


    if(role === "ai"){

        const avatar =
            document.createElement(
                "div"
            );

        avatar.className =
            "avatar";

        avatar.innerHTML = `

            <img
                src="https://i.ibb.co/whKQvZsw/Nova.jpg"
                alt="Nova">

        `;

        row.appendChild(
            avatar
        );

    }


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";


    const codeRegex =
        /```(?:[a-zA-Z0-9_+-]+)?\s*\n?([\s\S]*?)```/g;


    let lastIndex = 0;
    let match;
    let hasCode = false;


    while(
        (match =
            codeRegex.exec(content))
        !== null
    ){

        hasCode = true;


        const before =
            content.substring(
                lastIndex,
                match.index
            );


        if(before.trim()){

            const text =
                document.createElement(
                    "div"
                );

            text.textContent =
                before;

            text.style.whiteSpace =
                "pre-wrap";

            text.style.marginBottom =
                "8px";

            bubble.appendChild(
                text
            );

        }


        const wrapper =
            document.createElement(
                "div"
            );

        wrapper.className =
            "code-wrapper";


        const header =
            document.createElement(
                "div"
            );

        header.className =
            "code-header";


        const label =
            document.createElement(
                "span"
            );

        label.textContent =
            "Código";


        const copy =
            document.createElement(
                "button"
            );

        copy.className =
            "copy-code";

        copy.textContent =
            "Copiar";


        const codeText =
            match[1]
                .replace(/^\n/,"")
                .replace(/\n$/,"");


        copy.onclick =
            async function(){

                try{

                    await navigator
                        .clipboard
                        .writeText(
                            codeText
                        );

                    copy.textContent =
                        "Copiado";

                    setTimeout(
                        () => {

                            copy.textContent =
                                "Copiar";

                        },
                        1800
                    );

                }catch(error){

                    const temp =
                        document.createElement(
                            "textarea"
                        );

                    temp.value =
                        codeText;

                    document.body.appendChild(
                        temp
                    );

                    temp.select();

                    document.execCommand(
                        "copy"
                    );

                    temp.remove();

                    copy.textContent =
                        "Copiado";

                    setTimeout(
                        () => {

                            copy.textContent =
                                "Copiar";

                        },
                        1800
                    );

                }

            };


        header.appendChild(
            label
        );

        header.appendChild(
            copy
        );


        const pre =
            document.createElement(
                "pre"
            );

        pre.className =
            "code-content";

        pre.textContent =
            codeText;


        wrapper.appendChild(
            header
        );

        wrapper.appendChild(
            pre
        );

        bubble.appendChild(
            wrapper
        );


        lastIndex =
            codeRegex.lastIndex;

    }


    const after =
        content.substring(
            lastIndex
        );


    if(after.trim()){

        const text =
            document.createElement(
                "div"
            );

        text.textContent =
            after;

        text.style.whiteSpace =
            "pre-wrap";

        bubble.appendChild(
            text
        );

    }


    if(!hasCode){

        bubble.textContent =
            content;

    }


    row.appendChild(
        bubble
    );

    box.appendChild(
        row
    );
}


/* =========================================================
   PENSANDO
========================================================= */

function showThinking(){

    const box =
        document.getElementById(
            "messages"
        );

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message ai";

    row.id =
        "thinking";


    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "avatar";

    avatar.innerHTML = `

        <img
            src="https://i.ibb.co/whKQvZsw/Nova.jpg"
            alt="Nova">

    `;


    const loading =
        document.createElement(
            "div"
        );

    loading.className =
        "thinking";

    loading.innerHTML = `

        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>

    `;


    row.appendChild(
        avatar
    );

    row.appendChild(
        loading
    );

    box.appendChild(
        row
    );

    scrollBottom();
}


function removeThinking(){

    const element =
        document.getElementById(
            "thinking"
        );

    if(element){

        element.remove();

    }
}


/* =========================================================
   COMPROBAR SERVIDOR
========================================================= */

async function checkServer(){

    try{

        const response =
            await fetch(
                STATUS_URL,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }

        const data =
            await response.json();

        return (
            data &&
            data.success === true
        );

    }catch(error){

        console.error(
            "Error comprobando servidor:",
            error
        );

        return false;

    }
}


/* =========================================================
   ENVIAR MENSAJE
========================================================= */

async function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );

    const sendButton =
        document.querySelector(
            ".send-btn"
        );

    const message =
        input.value.trim();


    if(!message){

        return;

    }


    const chat =
        currentChat();

    if(!chat){

        createChat();

    }


    const activeChat =
        currentChat();


    if(!activeChat){

        return;

    }


    activeChat.messages.push({

        role:
            "user",

        content:
            message

    });


    if(
        activeChat.title ===
        "Nuevo chat"
    ){

        activeChat.title =
            generateTitle(
                message
            );

    }


    input.value = "";

    save();

    render();

    showThinking();


    if(sendButton){

        sendButton.disabled =
            true;

        sendButton.style.opacity =
            ".6";

    }


    try{

        /*
         * IMPORTANTE:
         * El servidor devuelve:
         *
         * {
         *   success: true,
         *   response: "..."
         * }
         *
         * No "reply".
         */

        const response =
            await fetch(
                CHAT_URL,
                {

                    method:
                        "POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                message,

                            /*
                             * Enviamos el historial
                             * actual para que Groq
                             * tenga contexto.
                             */

                            history:
                                activeChat.messages
                                    .slice(-20)
                        })

                }
            );


        let data = null;

        try{

            data =
                await response.json();

        }catch(jsonError){

            throw new Error(
                "El servidor no devolvió JSON."
            );

        }


        if(!response.ok){

            throw new Error(

                data?.error ||
                (
                    "Error HTTP " +
                    response.status
                )

            );

        }


        /*
         * AQUÍ ESTABA EL ERROR PRINCIPAL.
         *
         * Antes:
         *
         * const reply = data.reply;
         *
         * Ahora:
         *
         * const reply = data.response;
         */

        const reply =
            data?.response;


        if(
            !data ||
            data.success !== true ||
            typeof reply !== "string" ||
            !reply.trim()
        ){

            throw new Error(
                data?.error ||
                "El servidor respondió pero no devolvió una respuesta válida."
            );

        }


        removeThinking();


        activeChat.messages.push({

            role:
                "ai",

            content:
                reply

        });


        save();

        render();


    }catch(error){

        console.error(
            "Nova error:",
            error
        );

        removeThinking();


        let errorMessage =
            "No pude obtener una respuesta de Nova IA.";


        if(
            error &&
            error.message
        ){

            if(
                error.message.includes(
                    "Failed to fetch"
                )
            ){

                errorMessage =
                    "No se pudo conectar con el servidor de Nova IA.\n\n" +
                    "Comprueba que Render esté activo e inténtalo nuevamente.";

            }else{

                errorMessage +=
                    "\n\nDetalle: " +
                    error.message;

            }

        }


        activeChat.messages.push({

            role:
                "ai",

            content:
                errorMessage

        });


        save();

        render();

    }finally{

        if(sendButton){

            sendButton.disabled =
                false;

            sendButton.style.opacity =
                "1";

        }

    }

}


/* =========================================================
   TÍTULO
========================================================= */

function generateTitle(text){

    let title =
        text
            .replace(/\s+/g," ")
            .trim();


    if(title.length > 45){

        title =
            title
                .substring(
                    0,
                    45
                )
                .trim();

    }


    if(title.length > 0){

        title =
            title.charAt(0)
                .toUpperCase()
            +
            title.substring(1);

    }


    return title ||
        "Nuevo proyecto";
}


/* =========================================================
   LISTA DE CHATS
========================================================= */

function renderChatList(){

    const list =
        document.getElementById(
            "chatList"
        );

    list.innerHTML = "";


    chats.forEach(
        chat => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "chat-item";


            if(
                chat.id === currentId
            ){

                item.classList.add(
                    "selected"
                );

            }


            if(deleteMode){

                item.classList.add(
                    "delete-mode"
                );


                item.innerHTML = `

                    <span>
                        ${escapeHTML(
                            chat.title
                        )}
                    </span>

                    <span
                        class="delete-chat">
                        ×
                    </span>

                `;


                item.onclick =
                    event => {

                        event.stopPropagation();

                        deleteChat(
                            chat.id
                        );

                    };

            }else{

                item.textContent =
                    chat.title;


                item.onclick =
                    () => {

                        currentId =
                            chat.id;

                        save();

                        render();

                        closeSidebar();

                    };

            }


            list.appendChild(
                item
            );

        }
    );
}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHTML(text){

    return text

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   MODO ELIMINAR
========================================================= */

function toggleDeleteMode(){

    deleteMode =
        !deleteMode;


    const button =
        document.getElementById(
            "editButton"
        );


    button.textContent =
        deleteMode
            ?
            "Terminar edición"
            :
            "Editar chats";


    renderChatList();
}


/* =========================================================
   ELIMINAR CHAT
========================================================= */

function deleteChat(id){

    const chat =
        chats.find(
            c => c.id === id
        );


    if(!chat){

        return;

    }


    const old =
        document.getElementById(
            "novaConfirmOverlay"
        );


    if(old){

        old.remove();

    }


    const overlay =
        document.createElement(
            "div"
        );

    overlay.id =
        "novaConfirmOverlay";

    overlay.className =
        "nova-confirm-overlay";


    overlay.innerHTML = `

        <div class="nova-confirm">

            <div
                class="nova-confirm-logo">

                <img
                    src="https://i.ibb.co/whKQvZsw/Nova.jpg"
                    alt="Nova">

            </div>


            <h3>

                ¿Eliminar
                <span>este chat</span>?

            </h3>


            <p>

                La conversación
                <b>${escapeHTML(
                    chat.title
                )}</b>
                se eliminará de tus chats guardados.

                <br><br>

                Esta acción no se puede deshacer.

            </p>


            <div
                class="nova-confirm-buttons">

                <button
                    class="nova-cancel"
                    onclick="closeNovaConfirm()">

                    Cancelar

                </button>


                <button
                    class="nova-delete"
                    onclick="confirmNovaDelete('${chat.id}')">

                    Eliminar

                </button>

            </div>

        </div>

    `;


    document.body.appendChild(
        overlay
    );


    requestAnimationFrame(
        () => {

            overlay.classList.add(
                "show"
            );

        }
    );
}


/* =========================================================
   CERRAR CONFIRMACIÓN
========================================================= */

function closeNovaConfirm(){

    const overlay =
        document.getElementById(
            "novaConfirmOverlay"
        );


    if(!overlay){

        return;

    }


    overlay.classList.remove(
        "show"
    );


    setTimeout(
        () => {

            overlay.remove();

        },
        250
    );
}


/* =========================================================
   CONFIRMAR BORRADO
========================================================= */

function confirmNovaDelete(id){

    chats =
        chats.filter(
            chat =>
                chat.id !== id
        );


    if(currentId === id){

        if(chats.length){

            currentId =
                chats[0].id;

        }else{

            createChat();

        }

    }


    save();

    closeNovaConfirm();

    render();
}


/* =========================================================
   NUEVO CHAT
========================================================= */

function newChat(){

    createChat();

    deleteMode =
        false;


    document.getElementById(
        "editButton"
    ).textContent =
        "Editar chats";


    render();

    closeSidebar();
}


/* =========================================================
   LIMPIAR CHAT
========================================================= */

function clearChat(){

    const chat =
        currentChat();


    if(!chat){

        return;

    }


    chat.messages = [];

    save();

    render();
}


/* =========================================================
   SIDEBAR
========================================================= */

function openSidebar(){

    document
        .getElementById(
            "sidebar"
        )
        .classList.add(
            "open"
        );


    document
        .getElementById(
            "overlay"
        )
        .classList.add(
            "show"
        );
}


function closeSidebar(){

    document
        .getElementById(
            "sidebar"
        )
        .classList.remove(
            "open"
        );


    document
        .getElementById(
            "overlay"
        )
        .classList.remove(
            "show"
        );
}


/* =========================================================
   SCROLL
========================================================= */

function scrollBottom(){

    setTimeout(
        () => {

            const chat =
                document.getElementById(
                    "chat"
                );

            chat.scrollTop =
                chat.scrollHeight;

        },
        50
    );
}


/* =========================================================
   ENTER
========================================================= */

document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "keydown",
        event => {

            if(
                event.key === "Enter" &&
                !event.shiftKey
            ){

                event.preventDefault();

                sendMessage();

            }

        }
    );


/* =========================================================
   INICIO
========================================================= */

if(!chats.length){

    createChat();

}
else if(!currentChat()){

    currentId =
        chats[0].id;

    save();

}


render();


/* =========================================================
   COMPROBACIÓN INICIAL DEL SERVIDOR
========================================================= */

checkServer()
    .then(
        online => {

            if(online){

                console.log(
                    "Nova IA: servidor ONLINE"
                );

            }else{

                console.warn(
                    "Nova IA: el servidor no respondió al endpoint /status."
                );

            }

        }
    );
