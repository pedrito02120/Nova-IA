<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NOVA IA</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --yellow:#fff000;
    --yellow2:#ffe600;
    --cyan:#58dcff;
    --cyan2:#22c8ff;
    --black:#030303;
    --panel:rgba(8,8,8,.72);
    --border:rgba(255,240,0,.20);
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#030303;
    color:white;
}

/* =========================================================
   FONDO ANIMADO
========================================================= */

#background{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
    background:
        radial-gradient(circle at 15% 25%,rgba(255,240,0,.13),transparent 25%),
        radial-gradient(circle at 85% 70%,rgba(40,210,255,.11),transparent 27%),
        #030303;
}

/* GRID */

.grid{
    position:absolute;
    width:160%;
    height:100%;
    left:-30%;
    bottom:-38%;
    opacity:.24;
    background-image:
        linear-gradient(rgba(255,240,0,.16) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,240,0,.16) 1px,transparent 1px);
    background-size:70px 70px;
    transform:perspective(500px) rotateX(62deg);
    animation:gridMove 8s linear infinite;
}

@keyframes gridMove{
    from{
        transform:perspective(500px) rotateX(62deg) translateY(0);
    }
    to{
        transform:perspective(500px) rotateX(62deg) translateY(70px);
    }
}

/* LÍNEAS SUAVES */

.line{
    position:absolute;
    width:130%;
    height:1px;
    left:-15%;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,240,0,.65),
        rgba(89,217,255,.45),
        transparent
    );
    filter:blur(.5px);
    opacity:.35;
    transform:rotate(-16deg);
    animation:lineMove linear infinite;
}

.line:nth-child(2){
    top:12%;
    animation-duration:11s;
}

.line:nth-child(3){
    top:30%;
    animation-duration:15s;
    animation-delay:-5s;
}

.line:nth-child(4){
    top:52%;
    animation-duration:13s;
    animation-delay:-8s;
}

.line:nth-child(5){
    top:76%;
    animation-duration:17s;
    animation-delay:-3s;
}

@keyframes lineMove{
    0%{
        transform:translateX(-25%) rotate(-16deg);
    }
    50%{
        transform:translateX(10%) rotate(-16deg);
    }
    100%{
        transform:translateX(25%) rotate(-16deg);
    }
}

/* ORBES */

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(65px);
    opacity:.25;
    animation:orbFloat 9s ease-in-out infinite;
}

.orb.yellow{
    width:220px;
    height:220px;
    background:var(--yellow);
    left:-80px;
    top:15%;
}

.orb.cyan{
    width:240px;
    height:240px;
    background:var(--cyan);
    right:-90px;
    bottom:10%;
    animation-delay:-4s;
}

@keyframes orbFloat{
    0%,100%{
        transform:translate(0,0) scale(1);
    }
    50%{
        transform:translate(35px,-25px) scale(1.15);
    }
}

/* PARTÍCULAS */

.particles{
    position:absolute;
    inset:0;
}

.particle{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:var(--yellow);
    box-shadow:0 0 10px var(--yellow);
    opacity:.45;
    animation:particleFloat linear infinite;
}

.particle:nth-child(1){left:8%;top:20%;animation-duration:7s}
.particle:nth-child(2){left:18%;top:70%;animation-duration:11s}
.particle:nth-child(3){left:32%;top:35%;animation-duration:8s}
.particle:nth-child(4){left:45%;top:80%;animation-duration:13s}
.particle:nth-child(5){left:57%;top:18%;animation-duration:10s}
.particle:nth-child(6){left:69%;top:63%;animation-duration:9s}
.particle:nth-child(7){left:78%;top:30%;animation-duration:12s}
.particle:nth-child(8){left:91%;top:78%;animation-duration:8s}
.particle:nth-child(9){left:84%;top:48%;animation-duration:14s}
.particle:nth-child(10){left:24%;top:12%;animation-duration:10s}

@keyframes particleFloat{
    0%{
        transform:translateY(20px);
        opacity:.1;
    }
    50%{
        opacity:.7;
    }
    100%{
        transform:translateY(-70px);
        opacity:0;
    }
}

/* =========================================================
   APP
========================================================= */

.app{
    position:relative;
    z-index:2;
    display:flex;
    width:100%;
    height:100%;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
    width:280px;
    height:100%;
    background:rgba(3,3,3,.72);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-right:1px solid rgba(255,240,0,.16);
    display:flex;
    flex-direction:column;
    transition:.3s ease;
    z-index:20;
}

.sidebarTop{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px;
    border-bottom:1px solid rgba(255,255,255,.06);
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand img{
    width:36px;
    height:36px;
    border-radius:11px;
    object-fit:cover;
    border:1px solid rgba(255,240,0,.45);
    box-shadow:0 0 18px rgba(255,240,0,.22);
}

.brandText{
    font-size:16px;
    font-weight:800;
    letter-spacing:.4px;
}

.brandText span{
    color:var(--yellow);
}

.newChat{
    margin:16px;
    padding:11px 14px;
    border:1px solid rgba(255,240,0,.3);
    background:rgba(255,240,0,.07);
    color:white;
    border-radius:12px;
    cursor:pointer;
    font-size:13px;
    transition:.2s;
}

.newChat:hover{
    background:rgba(255,240,0,.14);
    border-color:rgba(255,240,0,.65);
}

.chatList{
    flex:1;
    overflow-y:auto;
    padding:0 10px 15px;
}

.chatItem{
    padding:12px;
    border-radius:10px;
    margin-bottom:5px;
    color:#bbb;
    cursor:pointer;
    font-size:13px;
    transition:.2s;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chatItem:hover{
    background:rgba(255,240,0,.07);
    color:white;
}

.chatItem.active{
    background:rgba(255,240,0,.11);
    color:var(--yellow);
    border:1px solid rgba(255,240,0,.14);
}

/* =========================================================
   MAIN
========================================================= */

.main{
    flex:1;
    min-width:0;
    height:100%;
    display:flex;
    flex-direction:column;
    position:relative;
}

/* HEADER */

.header{
    height:65px;
    min-height:65px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    border-bottom:1px solid rgba(255,255,255,.07);
    background:rgba(3,3,3,.48);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.headerLeft{
    display:flex;
    align-items:center;
    gap:12px;
}

.menuBtn{
    display:none;
}

.headerLogo{
    width:34px;
    height:34px;
    border-radius:10px;
    object-fit:cover;
    box-shadow:0 0 16px rgba(255,240,0,.22);
}

.headerTitle{
    font-size:15px;
    font-weight:700;
}

.headerTitle span{
    color:var(--yellow);
}

.status{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:11px;
    color:#999;
}

.statusDot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#666;
}

.statusDot.online{
    background:#7dff77;
    box-shadow:0 0 9px #7dff77;
}

/* =========================================================
   CHAT
========================================================= */

.messages{
    flex:1;
    overflow-y:auto;
    padding:30px 7%;
    scroll-behavior:smooth;
}

.messages::-webkit-scrollbar,
.chatList::-webkit-scrollbar{
    width:5px;
}

.messages::-webkit-scrollbar-thumb,
.chatList::-webkit-scrollbar-thumb{
    background:rgba(255,240,0,.18);
    border-radius:10px;
}

.welcome{
    max-width:700px;
    margin:8vh auto 0;
    text-align:center;
}

.welcomeLogo{
    width:72px;
    height:72px;
    object-fit:cover;
    border-radius:22px;
    border:1px solid rgba(255,240,0,.4);
    box-shadow:
        0 0 25px rgba(255,240,0,.18),
        0 0 70px rgba(255,240,0,.08);
    animation:logoFloat 4s ease-in-out infinite;
}

@keyframes logoFloat{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
}

.welcome h1{
    margin-top:22px;
    font-size:34px;
    font-weight:800;
    letter-spacing:-1px;
}

.welcome h1 span{
    color:var(--yellow);
    text-shadow:0 0 22px rgba(255,240,0,.3);
}

.welcome p{
    margin-top:10px;
    color:#999;
    font-size:14px;
}

.suggestions{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:9px;
    margin-top:26px;
}

.suggestion{
    padding:9px 13px;
    border:1px solid rgba(255,240,0,.16);
    background:rgba(255,240,0,.035);
    color:#ccc;
    border-radius:10px;
    font-size:12px;
    cursor:pointer;
    transition:.2s;
}

.suggestion:hover{
    color:white;
    border-color:rgba(255,240,0,.5);
    background:rgba(255,240,0,.08);
}

/* MENSAJES */

.message{
    width:100%;
    display:flex;
    margin:18px 0;
    gap:10px;
    align-items:flex-start;
}

/* IA A LA IZQUIERDA */
.message.ai{
    justify-content:flex-start;
}

/* USUARIO A LA DERECHA */
.message.user{
    justify-content:flex-end;
}

.avatar{
    width:31px;
    height:31px;
    min-width:31px;
    border-radius:10px;
    object-fit:cover;
}

.message.ai .avatar{
    order:0;
    border:1px solid rgba(255,240,0,.35);
    box-shadow:0 0 13px rgba(255,240,0,.14);
}

.message.user .avatar{
    order:2;
    background:linear-gradient(135deg,var(--yellow),var(--cyan));
    display:flex;
    align-items:center;
    justify-content:center;
    color:#050505;
    font-weight:900;
    font-size:12px;
    border:0;
}

/* BURBUJAS */

.bubble{
    max-width:min(760px,78%);
    padding:12px 15px;
    border-radius:16px;
    line-height:1.55;
    font-size:14px;
    white-space:pre-wrap;
    word-break:break-word;
}

/* IA */
.message.ai .bubble{
    order:1;
    background:rgba(10,10,10,.72);
    border:1px solid rgba(255,240,0,.14);
    border-top-left-radius:5px;
    box-shadow:0 8px 30px rgba(0,0,0,.15);
}

/* USUARIO */
.message.user .bubble{
    order:1;
    background:linear-gradient(
        135deg,
        rgba(255,240,0,.96),
        rgba(255,220,0,.9)
    );
    color:#050505;
    border:1px solid rgba(255,240,0,.8);
    border-top-right-radius:5px;
    box-shadow:
        0 5px 25px rgba(255,240,0,.13);
}

.message.user .bubble strong{
    color:#000;
}

/* =========================================================
   THINKING
========================================================= */

.thinking{
    display:flex;
    align-items:center;
    gap:5px;
    padding:4px 2px;
}

.thinking span{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--yellow);
    animation:thinking 1.2s infinite;
}

.thinking span:nth-child(2){
    animation-delay:.15s;
}

.thinking span:nth-child(3){
    animation-delay:.3s;
}

@keyframes thinking{
    0%,60%,100%{
        opacity:.25;
        transform:translateY(0);
    }
    30%{
        opacity:1;
        transform:translateY(-4px);
    }
}

/* CURSOR DE ESCRITURA */

.typing-cursor{
    display:inline-block;
    width:7px;
    height:16px;
    margin-left:2px;
    vertical-align:-3px;
    background:var(--yellow);
    box-shadow:0 0 9px rgba(255,240,0,.7);
    animation:cursorBlink .7s infinite;
}

@keyframes cursorBlink{
    50%{
        opacity:0;
    }
}

/* =========================================================
   CODE
========================================================= */

.codeBox{
    margin-top:10px;
    border:1px solid rgba(255,240,0,.18);
    border-radius:11px;
    overflow:hidden;
    background:#050505;
}

.codeHead{
    height:34px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;
    background:rgba(255,240,0,.05);
    border-bottom:1px solid rgba(255,255,255,.06);
}

.codeLang{
    font-size:10px;
    color:var(--yellow);
    text-transform:uppercase;
    letter-spacing:.6px;
}

.copyBtn{
    border:0;
    background:transparent;
    color:#999;
    cursor:pointer;
    font-size:10px;
}

.copyBtn:hover{
    color:var(--yellow);
}

.codeBox pre{
    padding:13px;
    overflow-x:auto;
    color:#ddd;
    font-family:Consolas,monospace;
    font-size:12px;
    line-height:1.55;
}

/* =========================================================
   INPUT
========================================================= */

.inputArea{
    padding:12px 7% 18px;
    background:linear-gradient(
        to top,
        rgba(3,3,3,.92),
        rgba(3,3,3,.45),
        transparent
    );
}

.inputBox{
    max-width:900px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:8px;
    padding:7px;
    border:1px solid rgba(255,240,0,.18);
    border-radius:17px;
    background:rgba(8,8,8,.76);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:
        0 10px 45px rgba(0,0,0,.25),
        0 0 30px rgba(255,240,0,.035);
    transition:.2s;
}

.inputBox:focus-within{
    border-color:rgba(255,240,0,.42);
    box-shadow:
        0 10px 45px rgba(0,0,0,.25),
        0 0 25px rgba(255,240,0,.07);
}

textarea{
    flex:1;
    resize:none;
    max-height:150px;
    min-height:42px;
    padding:12px 10px;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    font-family:inherit;
    font-size:14px;
    line-height:1.4;
}

textarea::placeholder{
    color:#777;
}

/* BOTONES */

.iconBtn{
    width:40px;
    height:40px;
    min-width:40px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.035);
    color:#aaa;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:.2s;
}

.iconBtn:hover{
    color:var(--yellow);
    border-color:rgba(255,240,0,.3);
    background:rgba(255,240,0,.07);
}

.iconBtn svg{
    width:18px;
    height:18px;
}

.sendBtn{
    width:42px;
    height:42px;
    min-width:42px;
    border:0;
    border-radius:12px;
    background:var(--yellow);
    color:#050505;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 0 17px rgba(255,240,0,.16);
}

.sendBtn:hover{
    transform:translateY(-1px);
    box-shadow:0 0 25px rgba(255,240,0,.28);
}

.sendBtn:disabled{
    opacity:.4;
    cursor:not-allowed;
    transform:none;
}

.sendBtn svg{
    width:19px;
    height:19px;
}

/* =========================================================
   OVERLAY MOBILE
========================================================= */

.overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:15;
}

/* =========================================================
   MODAL DELETE
========================================================= */

.modal{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(8px);
    z-index:100;
}

.modalBox{
    width:min(360px,90%);
    background:#090909;
    border:1px solid rgba(255,240,0,.22);
    border-radius:17px;
    padding:22px;
    box-shadow:0 20px 80px rgba(0,0,0,.5);
}

.modalBox h3{
    font-size:17px;
}

.modalBox p{
    margin-top:8px;
    color:#999;
    font-size:13px;
    line-height:1.5;
}

.modalActions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:20px;
}

.modalActions button{
    padding:9px 14px;
    border-radius:9px;
    border:1px solid rgba(255,255,255,.1);
    background:#111;
    color:#aaa;
    cursor:pointer;
}

.modalActions .danger{
    background:var(--yellow);
    color:#000;
    border-color:var(--yellow);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:800px){

    .sidebar{
        position:fixed;
        left:-290px;
        top:0;
        bottom:0;
        width:280px;
        transition:.3s ease;
        z-index:30;
    }

    .sidebar.open{
        left:0;
    }

    .overlay.open{
        display:block;
    }

    .menuBtn{
        display:flex;
        width:35px;
        height:35px;
        align-items:center;
        justify-content:center;
        border:0;
        background:transparent;
        color:#aaa;
        cursor:pointer;
    }

    .menuBtn:hover{
        color:var(--yellow);
    }

    .messages{
        padding:25px 14px;
    }

    .inputArea{
        padding:9px 10px 12px;
    }

    .bubble{
        max-width:82%;
        font-size:13px;
    }

    .welcome{
        margin-top:7vh;
    }

    .welcome h1{
        font-size:27px;
    }

    .welcomeLogo{
        width:62px;
        height:62px;
    }

    .status{
        display:none;
    }
}

@media(max-width:500px){

    .header{
        padding:0 12px;
    }

    .headerLogo{
        width:31px;
        height:31px;
    }

    .headerTitle{
        font-size:14px;
    }

    .message{
        margin:14px 0;
    }

    .avatar{
        width:28px;
        height:28px;
        min-width:28px;
    }

    .bubble{
        max-width:84%;
        padding:10px 12px;
        border-radius:14px;
    }

    .inputBox{
        border-radius:15px;
    }

    .iconBtn{
        width:38px;
        min-width:38px;
        height:38px;
    }

    .sendBtn{
        width:40px;
        min-width:40px;
        height:40px;
    }

    .suggestions{
        padding:0 10px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     FONDO
===================================================== -->

<div id="background">

    <div class="grid"></div>

    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>

    <div class="orb yellow"></div>
    <div class="orb cyan"></div>

    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

</div>

<div class="app">

    <!-- =================================================
         SIDEBAR
    ================================================== -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebarTop">

            <div class="brand">
                <img src="https://i.ibb.co/whKQvZsw/Nova.jpg">
                <div class="brandText">
                    NOVA <span>IA</span>
                </div>
            </div>

            <button class="iconBtn" onclick="closeSidebar()" aria-label="Cerrar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M6 6l12 12M18 6L6 18"/>
                </svg>
            </button>

        </div>

        <button class="newChat" onclick="newChat()">
            + Nuevo chat
        </button>

        <div class="chatList" id="chatList"></div>

    </aside>

    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

    <!-- =================================================
         MAIN
    ================================================== -->

    <main class="main">

        <header class="header">

            <div class="headerLeft">

                <button class="menuBtn" onclick="openSidebar()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2">
                        <path d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>

                <img class="headerLogo" src="https://i.ibb.co/whKQvZsw/Nova.jpg">

                <div class="headerTitle">
                    NOVA <span>IA</span>
                </div>

            </div>

            <div class="status">
                <div class="statusDot" id="statusDot"></div>
                <span id="statusText">Conectando...</span>
            </div>

        </header>

        <!-- =================================================
             MENSAJES
        ================================================== -->

        <section class="messages" id="messages">

            <div class="welcome" id="welcome">

                <img
                    class="welcomeLogo"
                    src="https://i.ibb.co/whKQvZsw/Nova.jpg"
                >

                <h1>
                    Bienvenido a <span>NOVA IA</span>
                </h1>

                <p>
                    Tu asistente de programación especializado en Roblox y Lua.
                </p>

                <div class="suggestions">

                    <button
                        class="suggestion"
                        onclick="useSuggestion('Créame un sistema de leaderboard en Roblox')">
                        Sistema de leaderboard
                    </button>

                    <button
                        class="suggestion"
                        onclick="useSuggestion('Créame una GUI profesional para Roblox')">
                        GUI profesional
                    </button>

                    <button
                        class="suggestion"
                        onclick="useSuggestion('Explícame este código Lua')">
                        Explicar código
                    </button>

                </div>

            </div>

        </section>

        <!-- =================================================
             INPUT
        ================================================== -->

        <div class="inputArea">

            <div class="inputBox">

                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Escribe un mensaje para Nova IA..."
                    autocomplete="off"
                ></textarea>

                <!-- SELECTOR DE IA PREPARADO -->
                <button
                    class="iconBtn"
                    onclick="openAISelector()"
                    aria-label="Seleccionar IA"
                    title="Seleccionar IA"
                >
                    <svg viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.8">
                        <path d="M12 3l1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7L12 3z"/>
                        <path d="M19 15l.7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7L19 15z"/>
                    </svg>
                </button>

                <button
                    class="sendBtn"
                    id="sendBtn"
                    onclick="sendMessage()"
                    aria-label="Enviar"
                >
                    <svg viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13"/>
                        <path d="M22 2l-7 20-4-9-9-4z"/>
                    </svg>
                </button>

            </div>

        </div>

    </main>

</div>

<!-- =====================================================
     MODAL
===================================================== -->

<div class="modal" id="deleteModal">

    <div class="modalBox">

        <h3>Eliminar chat</h3>

        <p>
            ¿Seguro que quieres eliminar esta conversación?
        </p>

        <div class="modalActions">

            <button onclick="closeNovaConfirm()">
                Cancelar
            </button>

            <button class="danger" onclick="confirmNovaDelete()">
                Eliminar
            </button>

        </div>

    </div>

</div>

<script>
/* =========================================================
   CONFIGURACIÓN
========================================================= */

const RENDER_URL = "https://nova-ia-2oup.onrender.com";
const CHAT_URL = RENDER_URL + "/chat";
const STATUS_URL = RENDER_URL + "/status";

const STORAGE_KEY = "nova_chats";
const CURRENT_KEY = "nova_current";

let chats = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
let currentId = localStorage.getItem(CURRENT_KEY);

let deleteMode = false;
let deleteTarget = null;


/* =========================================================
   GUARDAR
========================================================= */

function save(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(chats)
    );

    if(currentId){
        localStorage.setItem(
            CURRENT_KEY,
            currentId
        );
    }
}


/* =========================================================
   CREAR CHAT
========================================================= */

function createChat(){

    const chat = {
        id:Date.now().toString(),
        title:"Nuevo chat",
        messages:[]
    };

    chats.unshift(chat);
    currentId = chat.id;

    save();
}


/* =========================================================
   CHAT ACTUAL
========================================================= */

function currentChat(){

    return chats.find(
        c => c.id === currentId
    );
}


/* =========================================================
   RENDER
========================================================= */

function render(){

    const chat = currentChat();

    const messages = document.getElementById("messages");

    messages.innerHTML = "";

    if(!chat || !chat.messages.length){

        messages.innerHTML = `
            <div class="welcome" id="welcome">

                <img
                    class="welcomeLogo"
                    src="https://i.ibb.co/whKQvZsw/Nova.jpg"
                >

                <h1>
                    Bienvenido a <span>NOVA IA</span>
                </h1>

                <p>
                    Tu asistente de programación especializado en Roblox y Lua.
                </p>

                <div class="suggestions">

                    <button
                        class="suggestion"
                        onclick="useSuggestion('Créame un sistema de leaderboard en Roblox')">
                        Sistema de leaderboard
                    </button>

                    <button
                        class="suggestion"
                        onclick="useSuggestion('Créame una GUI profesional para Roblox')">
                        GUI profesional
                    </button>

                    <button
                        class="suggestion"
                        onclick="useSuggestion('Explícame este código Lua')">
                        Explicar código
                    </button>

                </div>

            </div>
        `;

        renderChatList();
        return;
    }

    chat.messages.forEach(msg => {

        addMessage(
            msg.role,
            msg.content,
            false
        );

    });

    renderChatList();
    scrollBottom();
}


/* =========================================================
   AÑADIR MENSAJE
========================================================= */

function addMessage(role,content,saveMessage=true){

    const messages =
        document.getElementById("messages");

    const row =
        document.createElement("div");

    row.className =
        "message " +
        (role === "user" ? "user" : "ai");


    /* AVATAR */

    const avatar =
        document.createElement("div");

    if(role === "user"){

        avatar.className = "avatar";
        avatar.textContent = "Y";

    }else{

        avatar.innerHTML = `
            <img
                class="avatar"
                src="https://i.ibb.co/whKQvZsw/Nova.jpg"
            >
        `;

    }


    /* BURBUJA */

    const bubble =
        document.createElement("div");

    bubble.className = "bubble";


    /* CONTENIDO */

    if(role === "ai"){

        renderFormattedContent(
            bubble,
            content
        );

    }else{

        bubble.textContent = content;

    }


    /* ORDEN */

    if(role === "user"){

        row.appendChild(bubble);
        row.appendChild(avatar);

    }else{

        row.appendChild(avatar);
        row.appendChild(bubble);

    }

    messages.appendChild(row);

    if(saveMessage){

        const chat = currentChat();

        if(chat){

            chat.messages.push({
                role:role,
                content:content
            });

            save();

        }

    }

    scrollBottom();

    return bubble;
}


/* =========================================================
   CONTENIDO FORMATEADO
========================================================= */

function renderFormattedContent(
    container,
    content
){

    const codeRegex =
        /```([a-zA-Z0-9_-]*)\n?([\s\S]*?)```/g;

    let lastIndex = 0;
    let match;

    while(
        (match = codeRegex.exec(content)) !== null
    ){

        const before =
            content.slice(
                lastIndex,
                match.index
            );

        if(before){

            const text =
                document.createElement("div");

            text.textContent = before;

            container.appendChild(text);

        }


        const codeBox =
            document.createElement("div");

        codeBox.className = "codeBox";

        const lang =
            match[1] || "code";

        const code =
            match[2].replace(/\n$/, "");


        codeBox.innerHTML = `

            <div class="codeHead">

                <span class="codeLang">
                    ${escapeHTML(lang)}
                </span>

                <button class="copyBtn">
                    Copiar
                </button>

            </div>

            <pre></pre>

        `;

        codeBox
            .querySelector("pre")
            .textContent = code;

        codeBox
            .querySelector(".copyBtn")
            .onclick = function(){

                navigator.clipboard
                    .writeText(code)
                    .then(() => {

                        this.textContent = "Copiado";

                        setTimeout(
                            () => this.textContent = "Copiar",
                            1500
                        );

                    });

            };

        container.appendChild(codeBox);

        lastIndex =
            match.index +
            match[0].length;
    }


    const after =
        content.slice(lastIndex);

    if(after){

        const text =
            document.createElement("div");

        text.textContent = after;

        container.appendChild(text);

    }

    if(!match){

        container.textContent = content;

    }
}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHTML(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   THINKING
========================================================= */

function showThinking(){

    const messages =
        document.getElementById("messages");

    const row =
        document.createElement("div");

    row.className = "message ai";
    row.id = "thinkingMessage";

    row.innerHTML = `

        <img
            class="avatar"
            src="https://i.ibb.co/whKQvZsw/Nova.jpg"
        >

        <div class="bubble">

            <div class="thinking">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>
    `;

    messages.appendChild(row);

    scrollBottom();
}


function removeThinking(){

    const thinking =
        document.getElementById(
            "thinkingMessage"
        );

    if(thinking){
        thinking.remove();
    }

}


/* =========================================================
   ESCRITURA PROGRESIVA
========================================================= */

async function typeResponse(
    bubble,
    content
){

    const cursor =
        document.createElement("span");

    cursor.className =
        "typing-cursor";

    bubble.appendChild(cursor);

    let text = "";

    const speed = 7;

    for(
        let i=0;
        i<content.length;
        i++
    ){

        text += content[i];

        cursor.remove();

        bubble.textContent = text;

        bubble.appendChild(cursor);

        scrollBottom();

        await new Promise(
            resolve =>
                setTimeout(resolve,speed)
        );

    }

    cursor.remove();

    bubble.innerHTML = "";

    renderFormattedContent(
        bubble,
        content
    );

    scrollBottom();
}


/* =========================================================
   ENVIAR
========================================================= */

async function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );

    const sendBtn =
        document.getElementById(
            "sendBtn"
        );

    const text =
        input.value.trim();

    if(!text) return;


    let chat = currentChat();

    if(!chat){

        createChat();

        chat = currentChat();

    }


    /* OCULTAR WELCOME */

    const welcome =
        document.getElementById(
            "welcome"
        );

    if(welcome){
        welcome.remove();
    }


    /* USUARIO */

    addMessage(
        "user",
        text,
        true
    );

    input.value = "";

    input.style.height = "auto";

    sendBtn.disabled = true;


    /* THINKING */

    showThinking();


    try{

        const history =
            chat.messages.map(
                msg => ({
                    role:msg.role,
                    content:msg.content
                })
            );


        const response =
            await fetch(
                CHAT_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        message:text,
                        history:history
                    })
                }
            );


        removeThinking();


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(
            !data ||
            !data.success ||
            !data.response
        ){

            throw new Error(
                "El servidor no devolvió una respuesta válida."
            );

        }


        /* CREAR BURBUJA VACÍA */

        const messages =
            document.getElementById(
                "messages"
            );

        const row =
            document.createElement("div");

        row.className =
            "message ai";


        const avatar =
            document.createElement("img");

        avatar.className =
            "avatar";

        avatar.src =
            "https://i.ibb.co/whKQvZsw/Nova.jpg";


        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble";


        row.appendChild(avatar);
        row.appendChild(bubble);

        messages.appendChild(row);


        /* GUARDAR RESPUESTA */

        chat.messages.push({
            role:"assistant",
            content:data.response
        });

        save();


        /* TÍTULO */

        if(
            chat.title === "Nuevo chat"
        ){

            chat.title =
                generateTitle(text);

            save();

            renderChatList();

        }


        /* ESCRITURA */

        await typeResponse(
            bubble,
            data.response
        );


    }catch(error){

        removeThinking();

        addMessage(
            "ai",
            "No pude obtener una respuesta de Nova IA.\n\nDetalle: " +
            error.message,
            true
        );

    }


    sendBtn.disabled = false;

    input.focus();
}


/* =========================================================
   TÍTULO
========================================================= */

function generateTitle(text){

    let title =
        text
            .replace(/\s+/g," ")
            .trim();

    if(title.length > 32){

        title =
            title.substring(0,32) +
            "...";

    }

    return title || "Nuevo chat";
}


/* =========================================================
   LISTA DE CHATS
========================================================= */

function renderChatList(){

    const list =
        document.getElementById(
            "chatList"
        );

    list.innerHTML = "";

    chats.forEach(chat => {

        const item =
            document.createElement("div");

        item.className =
            "chatItem " +
            (
                chat.id === currentId
                    ? "active"
                    : ""
            );

        item.textContent =
            chat.title || "Nuevo chat";

        item.onclick = () => {

            currentId = chat.id;

            save();

            render();

            closeSidebar();

        };

        list.appendChild(item);

    });

}


/* =========================================================
   NUEVO CHAT
========================================================= */

function newChat(){

    createChat();

    render();

    closeSidebar();

}


/* =========================================================
   SUGERENCIA
========================================================= */

function useSuggestion(text){

    const input =
        document.getElementById(
            "messageInput"
        );

    input.value = text;

    input.focus();

    autoResize();

}


/* =========================================================
   SIDEBAR
========================================================= */

function openSidebar(){

    document
        .getElementById("sidebar")
        .classList.add("open");

    document
        .getElementById("overlay")
        .classList.add("open");

}


function closeSidebar(){

    document
        .getElementById("sidebar")
        .classList.remove("open");

    document
        .getElementById("overlay")
        .classList.remove("open");

}


/* =========================================================
   BORRAR CHAT
========================================================= */

function toggleDeleteMode(){

    deleteMode =
        !deleteMode;

}


function deleteChat(id){

    deleteTarget = id;

    document
        .getElementById("deleteModal")
        .style.display = "flex";

}


function closeNovaConfirm(){

    deleteTarget = null;

    document
        .getElementById("deleteModal")
        .style.display = "none";

}


function confirmNovaDelete(){

    if(!deleteTarget) return;

    chats =
        chats.filter(
            c => c.id !== deleteTarget
        );


    if(currentId === deleteTarget){

        if(chats.length){

            currentId =
                chats[0].id;

        }else{

            createChat();

        }

    }

    save();

    closeNovaConfirm();

    render();

}


/* =========================================================
   SCROLL
========================================================= */

function scrollBottom(){

    const messages =
        document.getElementById(
            "messages"
        );

    setTimeout(() => {

        messages.scrollTop =
            messages.scrollHeight;

    },10);

}


/* =========================================================
   AUTO RESIZE
========================================================= */

function autoResize(){

    const input =
        document.getElementById(
            "messageInput"
        );

    input.style.height = "auto";

    input.style.height =
        Math.min(
            input.scrollHeight,
            150
        ) + "px";

}


/* =========================================================
   ENTER
========================================================= */

document
    .getElementById("messageInput")
    .addEventListener(
        "input",
        autoResize
    );


document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        function(e){

            if(
                e.key === "Enter" &&
                !e.shiftKey
            ){

                e.preventDefault();

                sendMessage();

            }

        }
    );


/* =========================================================
   SELECTOR DE IA
   PREPARADO PARA MÁS ADELANTE
========================================================= */

function openAISelector(){

    console.log(
        "Selector de IA preparado."
    );

}


/* =========================================================
   ESTADO DEL SERVIDOR
========================================================= */

async function checkServer(){

    const dot =
        document.getElementById(
            "statusDot"
        );

    const text =
        document.getElementById(
            "statusText"
        );

    try{

        const response =
            await fetch(
                STATUS_URL,
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error();

        }


        dot.classList.add(
            "online"
        );

        text.textContent =
            "Online";

    }catch{

        dot.classList.remove(
            "online"
        );

        text.textContent =
            "Offline";

    }

}


/* =========================================================
   INICIO
========================================================= */

if(!chats.length){

    createChat();

}else{

    const exists =
        chats.some(
            c => c.id === currentId
        );

    if(!exists){

        currentId =
            chats[0].id;

        save();

    }

}


render();

checkServer();

setInterval(
    checkServer,
    30000
);

</script>

</body>
</html>
