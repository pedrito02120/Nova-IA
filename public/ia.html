<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nova IA</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --yellow:#ffd000;
    --yellow-soft:#e9b900;
    --black:#050505;
    --panel:#0a0a0a;
    --panel2:#101010;
    --border:#242424;
    --text:#f5f5f5;
    --muted:#8d8d8d;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--black);
    color:var(--text);
}

/* FONDO */

body{
    background:
        radial-gradient(circle at 50% -20%,rgba(255,208,0,.09),transparent 38%),
        #050505;
}

.background-lights{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    opacity:.25;
}

.light{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    background:rgba(255,208,0,.12);
}

.light:nth-child(1){
    width:260px;
    height:260px;
    top:-120px;
    left:15%;
}

.light:nth-child(2){
    width:220px;
    height:220px;
    right:-100px;
    bottom:10%;
}

.light:nth-child(3){
    width:180px;
    height:180px;
    left:-90px;
    bottom:-50px;
}

/* APP */

.app{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    background:rgba(0,0,0,.25);
}

/* HEADER */

.header{
    height:64px;
    min-height:64px;
    display:flex;
    align-items:center;
    padding:0 16px;
    border-bottom:1px solid var(--border);
    background:rgba(5,5,5,.88);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    z-index:10;
}

.menu-btn,
.delete-btn{
    width:38px;
    height:38px;
    border:1px solid #292929;
    border-radius:11px;
    background:#0d0d0d;
    color:#ddd;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:.2s ease;
}

.menu-btn:hover,
.delete-btn:hover{
    border-color:rgba(255,208,0,.45);
    color:var(--yellow);
    background:#111;
}

.menu-btn svg,
.delete-btn svg{
    width:19px;
    height:19px;
}

.logo-small{
    width:34px;
    height:34px;
    border-radius:50%;
    object-fit:cover;
    margin-left:13px;
    border:1px solid rgba(255,208,0,.7);
    box-shadow:0 0 16px rgba(255,208,0,.12);
}

.title{
    margin-left:10px;
    font-size:16px;
    font-weight:600;
    letter-spacing:.2px;
}

.title span{
    color:var(--yellow);
}

.delete-btn{
    margin-left:auto;
}

/* CHAT */

.chat{
    flex:1;
    min-height:0;
    position:relative;
    overflow:hidden;
}

.messages{
    height:100%;
    overflow-y:auto;
    padding:30px 18px 150px;
    scroll-behavior:smooth;
}

.messages::-webkit-scrollbar{
    width:6px;
}

.messages::-webkit-scrollbar-track{
    background:transparent;
}

.messages::-webkit-scrollbar-thumb{
    background:#252525;
    border-radius:20px;
}

.messages::-webkit-scrollbar-thumb:hover{
    background:#363636;
}

/* WELCOME */

.welcome-message{
    max-width:760px;
    margin:7vh auto 0;
    text-align:center;
}

.logo-container{
    width:92px;
    height:92px;
    margin:0 auto 24px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.big-logo{
    width:68px;
    height:68px;
    border-radius:50%;
    object-fit:cover;
    position:relative;
    z-index:2;
    border:1px solid rgba(255,208,0,.7);
}

.logo-ring{
    position:absolute;
    inset:3px;
    border:1px solid rgba(255,208,0,.3);
    border-radius:50%;
}

.logo-glow{
    position:absolute;
    inset:-10px;
    border-radius:50%;
    background:rgba(255,208,0,.08);
    filter:blur(14px);
}

.welcome-message h1{
    font-size:34px;
    line-height:1.15;
    margin-bottom:12px;
    font-weight:700;
    letter-spacing:-.8px;
}

.welcome-message h1 span{
    color:var(--yellow);
}

.welcome-message p{
    max-width:540px;
    margin:0 auto;
    color:#929292;
    line-height:1.6;
    font-size:14px;
}

.suggestions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin:28px auto 0;
    max-width:620px;
}

.suggestion{
    padding:14px 15px;
    text-align:left;
    border:1px solid var(--border);
    border-radius:13px;
    background:#0b0b0b;
    color:#bdbdbd;
    cursor:pointer;
    transition:.2s ease;
    font-size:13px;
}

.suggestion:hover{
    border-color:rgba(255,208,0,.4);
    color:#fff;
    background:#101010;
}

/* MENSAJES */

.message{
    width:100%;
    max-width:850px;
    margin:0 auto 24px;
    display:flex;
    gap:11px;
    align-items:flex-start;
}

.message.user{
    justify-content:flex-end;
}

.avatar{
    width:31px;
    height:31px;
    flex:0 0 31px;
    border-radius:9px;
    object-fit:cover;
    border:1px solid #2b2b2b;
}

.message.user .avatar{
    order:2;
    border-color:rgba(255,208,0,.4);
}

.bubble{
    max-width:min(760px,82%);
    padding:13px 15px;
    border-radius:15px;
    line-height:1.55;
    font-size:14px;
    word-wrap:break-word;
    white-space:pre-wrap;
}

.message.ai .bubble{
    background:#0d0d0d;
    border:1px solid #202020;
    border-top-left-radius:5px;
    color:#e8e8e8;
}

.message.user .bubble{
    background:#161616;
    border:1px solid rgba(255,208,0,.25);
    border-top-right-radius:5px;
    color:#f5f5f5;
}

/* CÓDIGO */

.code-wrapper{
    margin:12px 0 3px;
    overflow:hidden;
    border:1px solid #292929;
    border-radius:12px;
    background:#070707;
}

.code-header{
    height:39px;
    display:flex;
    align-items:center;
    padding:0 11px;
    border-bottom:1px solid #252525;
    background:#0e0e0e;
}

.code-header::before{
    content:"";
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--yellow);
    margin-right:9px;
    box-shadow:0 0 8px rgba(255,208,0,.35);
}

.code-header span{
    font-size:11px;
    color:#858585;
    flex:1;
}

.copy-code{
    border:0;
    background:transparent;
    color:#999;
    font-size:11px;
    cursor:pointer;
    padding:5px 7px;
}

.copy-code:hover{
    color:var(--yellow);
}

.code-content{
    padding:14px;
    overflow-x:auto;
    font-family:Consolas,Monaco,monospace;
    font-size:12px;
    line-height:1.55;
    color:#ddd;
    white-space:pre;
}

/* THINKING */

.thinking{
    display:flex;
    gap:5px;
    align-items:center;
    padding:4px 0;
}

.thinking span{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#777;
    animation:thinking 1.2s infinite;
}

.thinking span:nth-child(2){
    animation-delay:.15s;
}

.thinking span:nth-child(3){
    animation-delay:.3s;
}

@keyframes thinking{
    0%,60%,100%{
        opacity:.25;
        transform:translateY(0);
    }
    30%{
        opacity:1;
        transform:translateY(-3px);
    }
}

/* INPUT */

.input-area{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:15px 18px 18px;
    background:linear-gradient(
        to top,
        rgba(5,5,5,1) 45%,
        rgba(5,5,5,.94) 75%,
        transparent
    );
    z-index:5;
}

.input-box{
    width:100%;
    max-width:850px;
    margin:auto;
    min-height:58px;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:7px;
    background:#0b0b0b;
    border:1px solid #292929;
    border-radius:18px;
    box-shadow:0 12px 35px rgba(0,0,0,.35);
    transition:.2s ease;
}

.input-box:focus-within{
    border-color:rgba(255,208,0,.4);
    box-shadow:0 12px 35px rgba(0,0,0,.4),0 0 0 2px rgba(255,208,0,.04);
}

textarea{
    flex:1;
    min-width:0;
    min-height:42px;
    max-height:160px;
    resize:none;
    padding:11px 10px;
    border:0;
    outline:0;
    background:transparent;
    color:#eee;
    font-family:Arial,Helvetica,sans-serif;
    font-size:14px;
    line-height:1.4;
}

textarea::placeholder{
    color:#696969;
}

/* BOTÓN IA */

.ai-selector-btn,
.send-btn{
    width:42px;
    height:42px;
    flex:0 0 42px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:.2s ease;
}

.ai-selector-btn{
    border:1px solid #292929;
    background:#101010;
    color:#aaa;
}

.ai-selector-btn:hover{
    color:var(--yellow);
    border-color:rgba(255,208,0,.45);
}

.ai-selector-btn svg{
    width:19px;
    height:19px;
}

.send-btn{
    border:1px solid var(--yellow);
    background:var(--yellow);
    color:#080808;
}

.send-btn:hover{
    background:#ffe16a;
    border-color:#ffe16a;
    transform:translateY(-1px);
}

.send-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
    transform:none;
}

.send-btn svg{
    width:19px;
    height:19px;
}

/* SIDEBAR */

.sidebar{
    position:fixed;
    top:0;
    bottom:0;
    left:0;
    width:300px;
    background:#080808;
    border-right:1px solid #252525;
    transform:translateX(-100%);
    transition:transform .25s ease;
    z-index:30;
    display:flex;
    flex-direction:column;
    box-shadow:20px 0 50px rgba(0,0,0,.35);
}

.sidebar.open{
    transform:translateX(0);
}

.sidebar-header{
    height:64px;
    display:flex;
    align-items:center;
    padding:0 14px;
    border-bottom:1px solid #242424;
}

.sidebar-title{
    font-size:15px;
    font-weight:600;
    flex:1;
}

.close-sidebar{
    width:36px;
    height:36px;
    border:1px solid #292929;
    border-radius:10px;
    background:#101010;
    color:#aaa;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.close-sidebar:hover{
    color:var(--yellow);
    border-color:rgba(255,208,0,.4);
}

.close-sidebar svg{
    width:18px;
    height:18px;
}

.sidebar-logo{
    padding:22px 20px 15px;
    display:flex;
    align-items:center;
    gap:11px;
}

.sidebar-logo img{
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid rgba(255,208,0,.55);
}

.sidebar-logo strong{
    font-size:15px;
}

.sidebar-logo small{
    display:block;
    margin-top:3px;
    color:#777;
    font-size:11px;
}

.new-chat{
    margin:0 15px 12px;
    height:44px;
    border:1px solid rgba(255,208,0,.35);
    border-radius:11px;
    background:#111;
    color:#eee;
    cursor:pointer;
    font-size:13px;
    transition:.2s ease;
}

.new-chat:hover{
    border-color:var(--yellow);
    color:var(--yellow);
    background:#141414;
}

.chat-list{
    flex:1;
    overflow-y:auto;
    padding:5px 10px 15px;
}

.chat-item{
    position:relative;
    display:flex;
    align-items:center;
    min-height:45px;
    padding:10px 11px;
    margin-bottom:4px;
    border-radius:10px;
    color:#aaa;
    cursor:pointer;
    font-size:13px;
    transition:.15s ease;
}

.chat-item:hover{
    background:#111;
    color:#eee;
}

.chat-item.active{
    background:rgba(255,208,0,.07);
    color:#fff;
    border:1px solid rgba(255,208,0,.15);
}

.chat-item.active::before{
    content:"";
    width:3px;
    height:18px;
    background:var(--yellow);
    border-radius:10px;
    position:absolute;
    left:0;
}

.chat-item.delete-mode{
    border:1px solid rgba(255,208,0,.3);
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.58);
    backdrop-filter:blur(2px);
    -webkit-backdrop-filter:blur(2px);
    opacity:0;
    visibility:hidden;
    transition:.2s ease;
    z-index:20;
}

.overlay.active{
    opacity:1;
    visibility:visible;
}

/* CONFIRMACIÓN */

.nova-confirm-overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
}

.nova-confirm{
    width:100%;
    max-width:360px;
    padding:24px;
    border:1px solid #303030;
    border-radius:17px;
    background:#0b0b0b;
    box-shadow:0 25px 80px rgba(0,0,0,.6);
    text-align:center;
}

.nova-confirm img{
    width:55px;
    height:55px;
    border-radius:50%;
    border:1px solid rgba(255,208,0,.55);
    margin-bottom:15px;
}

.nova-confirm h3{
    font-size:17px;
    margin-bottom:8px;
}

.nova-confirm p{
    color:#888;
    font-size:13px;
    line-height:1.5;
    margin-bottom:20px;
}

.nova-confirm-buttons{
    display:flex;
    gap:9px;
}

.nova-confirm-buttons button{
    flex:1;
    height:40px;
    border-radius:10px;
    cursor:pointer;
    font-size:13px;
}

.confirm-cancel{
    border:1px solid #292929;
    background:#111;
    color:#aaa;
}

.confirm-delete{
    border:1px solid var(--yellow);
    background:var(--yellow);
    color:#080808;
}

/* MOBILE */

@media(max-width:650px){

    .header{
        height:58px;
        min-height:58px;
        padding:0 11px;
    }

    .logo-small{
        width:31px;
        height:31px;
        margin-left:9px;
    }

    .title{
        font-size:15px;
    }

    .messages{
        padding:24px 12px 140px;
    }

    .welcome-message{
        margin-top:5vh;
    }

    .welcome-message h1{
        font-size:28px;
    }

    .welcome-message p{
        font-size:13px;
        padding:0 10px;
    }

    .logo-container{
        margin-bottom:19px;
    }

    .suggestions{
        grid-template-columns:1fr;
        margin:22px 5px 0;
    }

    .suggestion{
        padding:13px;
    }

    .message{
        margin-bottom:18px;
    }

    .bubble{
        max-width:88%;
        font-size:13px;
    }

    .input-area{
        padding:10px 10px 12px;
    }

    .input-box{
        min-height:55px;
        border-radius:16px;
        padding:6px;
    }

    textarea{
        font-size:14px;
    }

    .ai-selector-btn,
    .send-btn{
        width:40px;
        height:40px;
        flex-basis:40px;
        border-radius:11px;
    }

    .sidebar{
        width:min(300px,88vw);
    }
}

@media(prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
        scroll-behavior:auto!important;
    }
}
</style>
</head>

<body>

<div class="background-lights">
    <div class="light"></div>
    <div class="light"></div>
    <div class="light"></div>
</div>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <button class="menu-btn" onclick="openSidebar()" aria-label="Abrir menú">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>

        <img
            class="logo-small"
            src="https://i.ibb.co/whKQvZsw/Nova.jpg"
            alt="Nova IA"
        >

        <div class="title">
            <span>Nova</span> IA
        </div>

        <button class="delete-btn" onclick="clearChat()" aria-label="Limpiar chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M4 7h16"/>
                <path d="M9 7V4h6v3"/>
                <path d="M7 7l1 13h8l1-13"/>
                <path d="M10 11v5M14 11v5"/>
            </svg>
        </button>

    </header>

    <!-- CHAT -->

    <main class="chat">

        <div class="messages" id="messages">

            <div class="welcome-message" id="welcomeMessage">

                <div class="logo-container">
                    <div class="logo-glow"></div>
                    <div class="logo-ring"></div>

                    <img
                        class="big-logo"
                        src="https://i.ibb.co/whKQvZsw/Nova.jpg"
                        alt="Nova IA"
                    >
                </div>

                <h1>
                    Hola, soy <span>Nova IA</span>
                </h1>

                <p>
                    Tu asistente especializado en programación,
                    Roblox, Lua, scripts y desarrollo.
                </p>

                <div class="suggestions">

                    <div
                        class="suggestion"
                        onclick="useSuggestion('Créame un script de Roblox en Lua')"
                    >
                        Crear un script de Roblox
                    </div>

                    <div
                        class="suggestion"
                        onclick="useSuggestion('Ayúdame a corregir este código')"
                    >
                        Corregir un código
                    </div>

                    <div
                        class="suggestion"
                        onclick="useSuggestion('Explícame cómo funciona este script')"
                    >
                        Explicar un script
                    </div>

                    <div
                        class="suggestion"
                        onclick="useSuggestion('Créame una GUI profesional para Roblox')"
                    >
                        Crear una GUI
                    </div>

                </div>

            </div>

        </div>

        <!-- INPUT -->

        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Escribe un mensaje..."
                    autocomplete="off"
                ></textarea>

                <!-- BOTÓN PARA SELECCIONAR IA -->
                <button
                    class="ai-selector-btn"
                    type="button"
                    onclick="openAISelector()"
                    aria-label="Seleccionar IA"
                    title="Seleccionar IA"
                >
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/>
                        <path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16z"/>
                    </svg>
                </button>

                <!-- ENVIAR -->
                <button
                    class="send-btn"
                    id="sendBtn"
                    onclick="sendMessage()"
                    aria-label="Enviar mensaje"
                >
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 19V5"/>
                        <path d="M6 11l6-6 6 6"/>
                    </svg>
                </button>

            </div>

        </div>

    </main>

</div>

<!-- OVERLAY -->

<div
    class="overlay"
    id="overlay"
    onclick="closeSidebar()"
></div>

<!-- SIDEBAR -->

<aside class="sidebar" id="sidebar">

    <div class="sidebar-header">

        <div class="sidebar-title">
            Mis chats
        </div>

        <button
            class="close-sidebar"
            onclick="closeSidebar()"
            aria-label="Cerrar"
        >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 6l12 12M18 6L6 18"/>
            </svg>
        </button>

    </div>

    <div class="sidebar-logo">

        <img
            src="https://i.ibb.co/whKQvZsw/Nova.jpg"
            alt="Nova IA"
        >

        <div>
            <strong>Nova IA</strong>
            <small>Creada por Yander</small>
        </div>

    </div>

    <button class="new-chat" onclick="newChat()">
        + Nuevo chat
    </button>

    <div class="chat-list" id="chatList"></div>

</aside>

<script>

const RENDER_URL = "https://nova-ia-2oup.onrender.com";
const CHAT_URL = RENDER_URL + "/chat";
const STATUS_URL = RENDER_URL + "/status";

const STORAGE_KEY = "nova_chats";
const CURRENT_KEY = "nova_current";

let chats = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
let currentId = localStorage.getItem(CURRENT_KEY);
let deleteMode = false;


/* GUARDAR */

function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
    localStorage.setItem(CURRENT_KEY, currentId);
}


/* CREAR CHAT */

function createChat(){

    const chat = {
        id: Date.now().toString(),
        title: "Nuevo chat",
        messages: []
    };

    chats.unshift(chat);
    currentId = chat.id;

    save();
}


/* CHAT ACTUAL */

function currentChat(){
    return chats.find(chat => chat.id === currentId);
}


/* RENDER */

function render(){

    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcomeMessage");

    const activeChat = currentChat();

    if(!activeChat) return;

    messages.innerHTML = "";

    if(activeChat.messages.length === 0){

        messages.appendChild(welcome);

        return;
    }

    activeChat.messages.forEach(message => {
        addMessage(message.role, message.content, false);
    });

    renderChatList();
    scrollBottom();
}


/* AGREGAR MENSAJE */

function addMessage(role, content, saveMessage = false){

    const messages = document.getElementById("messages");

    const message = document.createElement("div");

    message.className = "message " + role;

    const avatar = document.createElement("img");

    avatar.className = "avatar";

    avatar.src = role === "ai"
        ? "https://i.ibb.co/whKQvZsw/Nova.jpg"
        : "https://i.ibb.co/whKQvZsw/Nova.jpg";

    avatar.alt = role === "ai" ? "Nova" : "Tú";

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    /*
        Detectar bloques de código
    */

    const regex = /```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g;

    let lastIndex = 0;
    let match;

    while((match = regex.exec(content)) !== null){

        const before = content.slice(lastIndex, match.index);

        if(before){
            const textNode = document.createTextNode(before);
            bubble.appendChild(textNode);
        }

        const wrapper = document.createElement("div");
        wrapper.className = "code-wrapper";

        const header = document.createElement("div");
        header.className = "code-header";

        const language = document.createElement("span");
        language.textContent = match[1] || "code";

        const copy = document.createElement("button");
        copy.className = "copy-code";
        copy.textContent = "Copiar";

        const codeText = match[2];

        copy.onclick = async function(){

            try{

                await navigator.clipboard.writeText(codeText);

                copy.textContent = "Copiado";

                setTimeout(() => {
                    copy.textContent = "Copiar";
                },1500);

            }catch(error){

                copy.textContent = "Error";

                setTimeout(() => {
                    copy.textContent = "Copiar";
                },1500);
            }
        };

        header.appendChild(language);
        header.appendChild(copy);

        const code = document.createElement("div");

        code.className = "code-content";
        code.textContent = codeText;

        wrapper.appendChild(header);
        wrapper.appendChild(code);

        bubble.appendChild(wrapper);

        lastIndex = regex.lastIndex;
    }

    const after = content.slice(lastIndex);

    if(after){
        const textNode = document.createTextNode(after);
        bubble.appendChild(textNode);
    }

    /*
        Si no había código
    */

    if(!regex.test(content)){

        bubble.textContent = content;
    }

    message.appendChild(avatar);
    message.appendChild(bubble);

    messages.appendChild(message);

    if(saveMessage){
        const activeChat = currentChat();

        if(activeChat){

            activeChat.messages.push({
                role,
                content
            });

            save();
        }
    }
}


/* THINKING */

function showThinking(){

    const messages = document.getElementById("messages");

    const message = document.createElement("div");

    message.className = "message ai";
    message.id = "thinkingMessage";

    const avatar = document.createElement("img");

    avatar.className = "avatar";
    avatar.src = "https://i.ibb.co/whKQvZsw/Nova.jpg";
    avatar.alt = "Nova";

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    const thinking = document.createElement("div");

    thinking.className = "thinking";

    thinking.innerHTML = `
        <span></span>
        <span></span>
        <span></span>
    `;

    bubble.appendChild(thinking);

    message.appendChild(avatar);
    message.appendChild(bubble);

    messages.appendChild(message);

    scrollBottom();
}


/* QUITAR THINKING */

function removeThinking(){

    const thinking = document.getElementById("thinkingMessage");

    if(thinking){
        thinking.remove();
    }
}


/* ESTADO DEL SERVIDOR */

async function checkServer(){

    try{

        const response = await fetch(STATUS_URL);

        if(!response.ok){
            throw new Error("Servidor no disponible");
        }

        return true;

    }catch(error){

        console.log("Servidor:", error.message);

        return false;
    }
}


/* ENVIAR */

async function sendMessage(){

    const input = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");

    const message = input.value.trim();

    if(!message) return;

    let activeChat = currentChat();

    if(!activeChat){

        createChat();

        activeChat = currentChat();
    }

    const isFirstMessage = activeChat.messages.length === 0;

    activeChat.messages.push({
        role:"user",
        content:message
    });

    if(isFirstMessage){
        activeChat.title = generateTitle(message);
    }

    input.value = "";

    input.style.height = "42px";

    save();
    render();

    showThinking();

    sendBtn.disabled = true;

    try{

        const response = await fetch(CHAT_URL,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                message:message,
                history:activeChat.messages.slice(-20)
            })
        });

        const data = await response.json();

        if(!response.ok){
            throw new Error(data?.error || "Error del servidor");
        }

        if(
            !data.success ||
            typeof data.response !== "string"
        ){
            throw new Error(
                data?.error ||
                "El servidor no devolvió una respuesta válida."
            );
        }

        removeThinking();

        activeChat.messages.push({
            role:"ai",
            content:data.response
        });

        save();
        render();

    }catch(error){

        removeThinking();

        const errorMessage =
            "No pude obtener una respuesta de Nova IA.\n\n" +
            "Detalle: " +
            error.message;

        activeChat.messages.push({
            role:"ai",
            content:errorMessage
        });

        save();
        render();

    }finally{

        sendBtn.disabled = false;

        input.focus();
    }
}


/* TITULO */

function generateTitle(text){

    let title = text.trim();

    if(title.length > 30){
        title = title.substring(0,30) + "...";
    }

    return title || "Nuevo chat";
}


/* LISTA DE CHATS */

function renderChatList(){

    const list = document.getElementById("chatList");

    if(!list) return;

    list.innerHTML = "";

    chats.forEach(chat => {

        const item = document.createElement("div");

        item.className = "chat-item";

        if(chat.id === currentId){
            item.classList.add("active");
        }

        if(deleteMode){
            item.classList.add("delete-mode");
        }

        item.textContent = chat.title || "Nuevo chat";

        item.onclick = function(){

            if(deleteMode){

                deleteChat(chat.id);

                return;
            }

            currentId = chat.id;

            save();

            render();

            closeSidebar();
        };

        list.appendChild(item);

    });
}


/* EDITAR / ELIMINAR */

function toggleDeleteMode(){

    deleteMode = !deleteMode;

    renderChatList();
}


/* BORRAR CHAT */

function deleteChat(id){

    const chat = chats.find(c => c.id === id);

    if(!chat) return;

    showDeleteConfirmation(id, chat.title);
}


/* CONFIRMACIÓN */

function showDeleteConfirmation(id, title){

    const existing = document.getElementById("novaConfirmOverlay");

    if(existing){
        existing.remove();
    }

    const overlay = document.createElement("div");

    overlay.className = "nova-confirm-overlay";
    overlay.id = "novaConfirmOverlay";

    overlay.innerHTML = `
        <div class="nova-confirm">

            <img
                src="https://i.ibb.co/whKQvZsw/Nova.jpg"
                alt="Nova IA"
            >

            <h3>Eliminar chat</h3>

            <p>
                ¿Seguro que quieres eliminar
                "${escapeHTML(title || "este chat")}"?
            </p>

            <div class="nova-confirm-buttons">

                <button
                    class="confirm-cancel"
                    onclick="closeNovaConfirm()"
                >
                    Cancelar
                </button>

                <button
                    class="confirm-delete"
                    onclick="confirmNovaDelete('${id}')"
                >
                    Eliminar
                </button>

            </div>

        </div>
    `;

    document.body.appendChild(overlay);
}


/* CERRAR CONFIRMACIÓN */

function closeNovaConfirm(){

    const overlay = document.getElementById("novaConfirmOverlay");

    if(overlay){
        overlay.remove();
    }
}


/* CONFIRMAR ELIMINACIÓN */

function confirmNovaDelete(id){

    chats = chats.filter(chat => chat.id !== id);

    if(currentId === id){

        if(chats.length > 0){
            currentId = chats[0].id;
        }else{
            createChat();
        }
    }

    save();

    closeNovaConfirm();

    deleteMode = false;

    render();
    renderChatList();
}


/* NUEVO CHAT */

function newChat(){

    createChat();

    deleteMode = false;

    render();

    renderChatList();

    closeSidebar();

    setTimeout(() => {
        document.getElementById("messageInput").focus();
    },100);
}


/* LIMPIAR CHAT */

function clearChat(){

    const activeChat = currentChat();

    if(!activeChat) return;

    if(activeChat.messages.length === 0) return;

    showClearConfirmation();
}


/* CONFIRMAR LIMPIAR */

function showClearConfirmation(){

    const existing = document.getElementById("novaConfirmOverlay");

    if(existing){
        existing.remove();
    }

    const overlay = document.createElement("div");

    overlay.className = "nova-confirm-overlay";
    overlay.id = "novaConfirmOverlay";

    overlay.innerHTML = `
        <div class="nova-confirm">

            <img
                src="https://i.ibb.co/whKQvZsw/Nova.jpg"
                alt="Nova IA"
            >

            <h3>Limpiar conversación</h3>

            <p>
                Se eliminarán los mensajes de este chat.
            </p>

            <div class="nova-confirm-buttons">

                <button
                    class="confirm-cancel"
                    onclick="closeNovaConfirm()"
                >
                    Cancelar
                </button>

                <button
                    class="confirm-delete"
                    onclick="confirmClearChat()"
                >
                    Limpiar
                </button>

            </div>

        </div>
    `;

    document.body.appendChild(overlay);
}


/* CONFIRMAR LIMPIAR */

function confirmClearChat(){

    const activeChat = currentChat();

    if(activeChat){

        activeChat.messages = [];
        activeChat.title = "Nuevo chat";

        save();
    }

    closeNovaConfirm();

    render();
    renderChatList();
}


/* SIDEBAR */

function openSidebar(){

    document.getElementById("sidebar")
        .classList.add("open");

    document.getElementById("overlay")
        .classList.add("active");

    renderChatList();
}


function closeSidebar(){

    document.getElementById("sidebar")
        .classList.remove("open");

    document.getElementById("overlay")
        .classList.remove("active");
}


/* SCROLL */

function scrollBottom(){

    const messages = document.getElementById("messages");

    setTimeout(() => {
        messages.scrollTop = messages.scrollHeight;
    },50);
}


/* SUGERENCIA */

function useSuggestion(text){

    const input = document.getElementById("messageInput");

    input.value = text;

    input.focus();

    autoResize();

    sendMessage();
}


/* AUTO RESIZE */

function autoResize(){

    const input = document.getElementById("messageInput");

    input.style.height = "42px";

    input.style.height =
        Math.min(input.scrollHeight,160) + "px";
}


/* BOTÓN DE SELECCIÓN DE IA */

/*
    Este botón queda preparado.

    El selector de modelos/IA lo agregaremos
    posteriormente sin tocar el sistema de chats.
*/

function openAISelector(){

    console.log("Selector de IA preparado para la siguiente fase.");

}


/* ENTER */

document
    .getElementById("messageInput")
    .addEventListener("input",autoResize);


document
    .getElementById("messageInput")
    .addEventListener("keydown",function(event){

        if(event.key === "Enter" && !event.shiftKey){

            event.preventDefault();

            sendMessage();
        }

    });


/* INICIO */

if(chats.length === 0){

    createChat();

}else if(
    !currentId ||
    !chats.some(chat => chat.id === currentId)
){

    currentId = chats[0].id;

    save();
}

render();
renderChatList();

checkServer().then(status => {

    if(!status){
        console.log("Nova IA: servidor no disponible.");
    }

});

</script>
