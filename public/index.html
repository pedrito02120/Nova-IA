<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA IA</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#020202;
    color:white;
}

/* =========================================================
   FONDO
========================================================= */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:0;
    background:
        radial-gradient(
            circle at 20% 25%,
            rgba(255,240,0,.12),
            transparent 28%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(60,210,255,.10),
            transparent 30%
        ),
        #020202;
}

/* =========================================================
   GRID
========================================================= */

.grid{
    position:absolute;
    width:170%;
    height:100%;
    left:-35%;
    bottom:-43%;

    background-image:
        linear-gradient(
            rgba(255,240,0,.13) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,240,0,.13) 1px,
            transparent 1px
        );

    background-size:70px 70px;

    transform:
        perspective(500px)
        rotateX(62deg);

    opacity:.22;

    animation:gridMove 8s linear infinite;
}

@keyframes gridMove{

    from{
        transform:
            perspective(500px)
            rotateX(62deg)
            translateY(0);
    }

    to{
        transform:
            perspective(500px)
            rotateX(62deg)
            translateY(70px);
    }

}

/* =========================================================
   ORBES
========================================================= */

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(75px);
    pointer-events:none;
}

.orbYellow{
    width:260px;
    height:260px;
    left:-100px;
    top:10%;
    background:rgba(255,240,0,.22);
    animation:floatYellow 9s ease-in-out infinite;
}

.orbCyan{
    width:280px;
    height:280px;
    right:-110px;
    bottom:5%;
    background:rgba(40,210,255,.17);
    animation:floatCyan 10s ease-in-out infinite;
}

@keyframes floatYellow{

    0%,100%{
        transform:translate(0,0);
    }

    50%{
        transform:translate(45px,-30px);
    }

}

@keyframes floatCyan{

    0%,100%{
        transform:translate(0,0);
    }

    50%{
        transform:translate(-40px,25px);
    }

}

/* =========================================================
   PARTÍCULAS
========================================================= */

.particles{
    position:absolute;
    inset:0;
}

.particle{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#fff000;
    box-shadow:0 0 10px #fff000;
    opacity:.45;
    animation:particleMove linear infinite;
}

.particle:nth-child(1){
    left:8%;
    top:20%;
    animation-duration:8s;
}

.particle:nth-child(2){
    left:18%;
    top:70%;
    animation-duration:11s;
}

.particle:nth-child(3){
    left:31%;
    top:35%;
    animation-duration:9s;
}

.particle:nth-child(4){
    left:45%;
    top:80%;
    animation-duration:13s;
}

.particle:nth-child(5){
    left:57%;
    top:18%;
    animation-duration:10s;
}

.particle:nth-child(6){
    left:68%;
    top:62%;
    animation-duration:12s;
}

.particle:nth-child(7){
    left:79%;
    top:30%;
    animation-duration:9s;
}

.particle:nth-child(8){
    left:91%;
    top:78%;
    animation-duration:14s;
}

.particle:nth-child(9){
    left:84%;
    top:48%;
    animation-duration:10s;
}

.particle:nth-child(10){
    left:25%;
    top:12%;
    animation-duration:12s;
}

@keyframes particleMove{

    0%{
        transform:translateY(30px);
        opacity:.05;
    }

    50%{
        opacity:.7;
    }

    100%{
        transform:translateY(-80px);
        opacity:0;
    }

}

/* =========================================================
   APP
========================================================= */

.page{
    position:relative;
    z-index:2;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

/* =========================================================
   TARJETA
========================================================= */

.card{
    width:min(850px,100%);
    text-align:center;

    background:transparent;

    border:0;

    padding:30px;

    animation:cardAppear .8s ease forwards;
}

@keyframes cardAppear{

    from{
        opacity:0;
        transform:translateY(18px) scale(.98);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }

}

/* =========================================================
   LOGO
========================================================= */

.logoWrap{
    position:relative;
    width:115px;
    height:115px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    animation:logoFloat 4s ease-in-out infinite;
}

.logoGlow{
    position:absolute;
    inset:-14px;
    border-radius:34px;

    background:
        radial-gradient(
            circle,
            rgba(255,240,0,.30),
            transparent 68%
        );

    filter:blur(12px);
}

.logoRing{
    position:absolute;
    inset:-3px;

    border-radius:31px;

    border:1px solid rgba(255,240,0,.35);

    box-shadow:
        0 0 20px rgba(255,240,0,.16),
        inset 0 0 20px rgba(255,240,0,.06);
}

.logo{
    width:100px;
    height:100px;

    border-radius:28px;

    object-fit:cover;

    position:relative;
    z-index:2;

    box-shadow:
        0 0 25px rgba(255,240,0,.18);
}

@keyframes logoFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }

}

/* =========================================================
   TEXTO
========================================================= */

h1{
    margin-top:30px;

    font-size:clamp(
        38px,
        7vw,
        70px
    );

    line-height:1;

    font-weight:900;

    letter-spacing:-3px;

    color:white;
}

h1 span{
    color:#fff000;

    text-shadow:
        0 0 15px rgba(255,240,0,.22),
        0 0 40px rgba(255,240,0,.10);
}

.subtitle{
    margin-top:18px;

    color:#aaa;

    font-size:15px;

    line-height:1.6;
}

.subtitle strong{
    color:#fff000;
}

/* =========================================================
   TAGS
========================================================= */

.tags{
    margin-top:26px;

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:9px;
}

.tag{
    padding:8px 12px;

    border-radius:9px;

    border:1px solid rgba(255,240,0,.16);

    background:rgba(255,240,0,.035);

    color:#bbb;

    font-size:11px;

    transition:.2s;
}

.tag:hover{
    color:white;

    border-color:rgba(255,240,0,.45);

    background:rgba(255,240,0,.08);
}

/* =========================================================
   BOTÓN
========================================================= */

.startBtn{
    margin-top:32px;

    padding:12px 20px;

    border-radius:12px;

    border:1px solid rgba(255,240,0,.55);

    background:#fff000;

    color:#050505;

    font-size:13px;

    font-weight:800;

    cursor:pointer;

    transition:.25s;

    box-shadow:
        0 0 18px rgba(255,240,0,.12);
}

.startBtn:hover{

    transform:translateY(-2px);

    box-shadow:
        0 0 30px rgba(255,240,0,.25);
}

.startBtn:active{
    transform:translateY(0);
}

/* =========================================================
   CREADOR
========================================================= */

.creator{
    margin-top:25px;

    color:#666;

    font-size:11px;
}

.creator span{
    color:#fff000;
}

/* =========================================================
   TRANSICIÓN
========================================================= */

body{
    opacity:1;
    transition:opacity .25s ease;
}

/* =========================================================
   MÓVIL
========================================================= */

@media(max-width:600px){

    .page{
        padding:14px;
    }

    .card{
        padding:15px;
    }

    .logoWrap{
        width:95px;
        height:95px;
    }

    .logo{
        width:82px;
        height:82px;
        border-radius:23px;
    }

    h1{
        margin-top:25px;
        letter-spacing:-2px;
    }

    .subtitle{
        font-size:13px;
        padding:0 10px;
    }

    .tags{
        gap:7px;
    }

    .tag{
        font-size:10px;
        padding:7px 10px;
    }

    .startBtn{
        margin-top:27px;
    }

}

/* =========================================================
   REDUCIR ANIMACIÓN SI EL SISTEMA LO PIDE
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation:none !important;
        transition:none !important;
    }

}
</style>
</head>

<body>

<!-- =====================================================
     FONDO ANIMADO
===================================================== -->

<div class="background">

    <div class="grid"></div>

    <div class="orb orbYellow"></div>
    <div class="orb orbCyan"></div>

    <div class="particles">

        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

    </div>

</div>

<!-- =====================================================
     CONTENIDO
===================================================== -->

<div class="page">

    <main class="card">

        <div class="logoWrap">

            <div class="logoGlow"></div>

            <div class="logoRing"></div>

            <img
                class="logo"
                src="https://i.ibb.co/whKQvZsw/Nova.jpg"
                alt="NOVA IA"
            >

        </div>

        <h1>
            NOVA <span>IA</span>
        </h1>

        <p class="subtitle">
            Tu asistente inteligente para
            <strong>programación, Roblox y Lua.</strong>
        </p>

        <div class="tags">

            <div class="tag">
                Roblox
            </div>

            <div class="tag">
                Lua
            </div>

            <div class="tag">
                Scripts
            </div>

            <div class="tag">
                Programación
            </div>

        </div>

        <button
            class="startBtn"
            onclick="openIA()"
        >
            Comenzar con Nova
        </button>

        <div class="creator">
            Creada por <span>Yander</span>
        </div>

    </main>

</div>

<script>

/* =========================================================
   ABRIR NOVA IA
========================================================= */

function openIA(){

    document.body.style.opacity = "0";

    setTimeout(function(){

        window.location.href = "ia.html";

    },250);

}


/* =========================================================
   SOLUCIONAR REGRESO CON BOTÓN ATRÁS
========================================================= */

window.addEventListener(
    "pageshow",
    function(){

        document.body.style.opacity = "1";

    }
);


/* =========================================================
   SOLUCIONAR REGRESO DESDE OTRA PÁGINA
========================================================= */

window.addEventListener(
    "focus",
    function(){

        document.body.style.opacity = "1";

    }
);

</script>

</body>
</html>
