<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova IA</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#030303;
    color:white;
    overflow:hidden;
}

/* =========================
   FONDO
========================= */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 20%,rgba(255,0,0,.10),transparent 30%),
        radial-gradient(circle at 85% 80%,rgba(0,150,255,.06),transparent 25%),
        #030303;
}

/* Líneas animadas */

.lines{
    position:absolute;
    inset:0;
    overflow:hidden;
    opacity:.45;
}

.line{
    position:absolute;
    width:2px;
    height:150%;
    background:linear-gradient(
        transparent,
        rgba(255,0,0,.15),
        rgba(255,30,30,.8),
        rgba(255,0,0,.12),
        transparent
    );
    filter:blur(.4px);
    transform:rotate(25deg);
    animation:lineMove linear infinite;
}

.line:nth-child(1){
    left:5%;
    animation-duration:9s;
}

.line:nth-child(2){
    left:17%;
    animation-duration:12s;
    animation-delay:-3s;
}

.line:nth-child(3){
    left:29%;
    animation-duration:10s;
    animation-delay:-6s;
}

.line:nth-child(4){
    left:41%;
    animation-duration:14s;
    animation-delay:-4s;
}

.line:nth-child(5){
    left:55%;
    animation-duration:11s;
    animation-delay:-8s;
}

.line:nth-child(6){
    left:68%;
    animation-duration:13s;
    animation-delay:-2s;
}

.line:nth-child(7){
    left:82%;
    animation-duration:10s;
    animation-delay:-5s;
}

.line:nth-child(8){
    left:95%;
    animation-duration:15s;
    animation-delay:-9s;
}

@keyframes lineMove{
    0%{
        transform:translateY(-60%) rotate(25deg);
    }
    100%{
        transform:translateY(70%) rotate(25deg);
    }
}

/* Cuadrícula */

.grid{
    position:absolute;
    width:200%;
    height:200%;
    left:-50%;
    top:-20%;
    opacity:.07;
    background-image:
        linear-gradient(rgba(255,0,0,.25) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,0,0,.20) 1px,transparent 1px);
    background-size:65px 65px;
    transform:perspective(600px) rotateX(65deg);
    animation:gridMove 18s linear infinite;
}

@keyframes gridMove{
    from{
        transform:perspective(600px) rotateX(65deg) translateY(0);
    }
    to{
        transform:perspective(600px) rotateX(65deg) translateY(65px);
    }
}

/* Luces */

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    pointer-events:none;
}

.orb.red{
    width:300px;
    height:300px;
    background:#ff0000;
    opacity:.13;
    left:-120px;
    top:15%;
    animation:redOrb 12s ease-in-out infinite;
}

.orb.blue{
    width:250px;
    height:250px;
    background:#008cff;
    opacity:.08;
    right:-100px;
    bottom:10%;
    animation:blueOrb 15s ease-in-out infinite;
}

@keyframes redOrb{
    0%,100%{
        transform:translate(0,0);
    }
    50%{
        transform:translate(140px,80px);
    }
}

@keyframes blueOrb{
    0%,100%{
        transform:translate(0,0);
    }
    50%{
        transform:translate(-120px,-70px);
    }
}

/* Partículas */

.particles{
    position:absolute;
    inset:0;
    background-image:
        radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1px),
        radial-gradient(circle,rgba(255,0,0,.8) 1px,transparent 1px);
    background-size:100px 100px,150px 150px;
    background-position:20px 30px,70px 50px;
    opacity:.10;
    animation:particlesMove 25s linear infinite;
}

@keyframes particlesMove{
    from{
        transform:translate(0,0);
    }
    to{
        transform:translate(-100px,100px);
    }
}

/* =========================
   CONTENIDO
========================= */

.page{
    position:relative;
    z-index:2;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.card{
    width:min(900px,100%);
    min-height:600px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:50px 25px;

    background:rgba(7,7,7,.70);
    border:1px solid rgba(255,0,0,.18);
    border-radius:30px;

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 0 80px rgba(255,0,0,.06),
        inset 0 0 50px rgba(255,255,255,.015);

    animation:cardEnter 1s cubic-bezier(.16,1,.3,1);
}

@keyframes cardEnter{
    from{
        opacity:0;
        transform:translateY(30px) scale(.96);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* =========================
   LOGO
========================= */

.logoContainer{
    position:relative;
    width:125px;
    height:125px;
    margin-bottom:28px;
    animation:logoFloat 4s ease-in-out infinite;
}

.logoGlow{
    position:absolute;
    inset:-25px;
    border-radius:50%;
    background:radial-gradient(
        circle,
        rgba(255,0,0,.35),
        transparent 65%
    );
    filter:blur(12px);
    animation:logoGlow 3s ease-in-out infinite;
}

.logoRing{
    position:absolute;
    inset:-9px;
    border-radius:50%;
    border:1px solid rgba(255,0,0,.6);
    border-top-color:rgba(255,255,255,.8);
    animation:ringRotate 7s linear infinite;
}

.logoRing::before{
    content:"";
    position:absolute;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#ff3030;
    box-shadow:0 0 15px #ff0000;
    top:5px;
    left:50%;
}

.logo{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    border:3px solid #ff2020;
    box-shadow:
        0 0 25px rgba(255,0,0,.35),
        0 0 60px rgba(255,0,0,.12);
}

@keyframes logoFloat{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
}

@keyframes logoGlow{
    0%,100%{
        opacity:.5;
        transform:scale(.95);
    }
    50%{
        opacity:1;
        transform:scale(1.08);
    }
}

@keyframes ringRotate{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   TEXTO
========================= */

h1{
    font-size:clamp(38px,7vw,65px);
    font-weight:800;
    letter-spacing:-3px;
    animation:textEnter .9s .15s both cubic-bezier(.16,1,.3,1);
}

h1 span{
    color:#ff2020;
    text-shadow:0 0 25px rgba(255,0,0,.25);
}

.subtitle{
    margin-top:12px;
    color:#999;
    text-align:center;
    font-size:16px;
    animation:textEnter .9s .25s both cubic-bezier(.16,1,.3,1);
}

@keyframes textEnter{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
   TAGS
========================= */

.tags{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:24px;
    animation:textEnter .9s .35s both cubic-bezier(.16,1,.3,1);
}

.tag{
    padding:8px 13px;
    border:1px solid rgba(255,0,0,.18);
    border-radius:10px;
    color:#999;
    background:rgba(255,0,0,.035);
    font-size:12px;
    transition:.25s;
}

.tag:hover{
    color:#ff3030;
    border-color:rgba(255,0,0,.5);
    background:rgba(255,0,0,.08);
    transform:translateY(-2px);
    box-shadow:0 0 18px rgba(255,0,0,.08);
}

/* =========================
   BOTÓN
========================= */

.startBtn{
    margin-top:34px;
    height:52px;
    padding:0 25px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    border-radius:14px;
    border:1px solid rgba(255,0,0,.55);

    background:rgba(255,0,0,.07);
    color:#ff3030;

    font-size:14px;
    font-weight:700;

    cursor:pointer;
    position:relative;
    overflow:hidden;

    transition:.25s;

    animation:textEnter .9s .45s both cubic-bezier(.16,1,.3,1);
}

.startBtn::before{
    content:"";
    position:absolute;
    width:45px;
    height:100%;
    left:-70px;
    top:0;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.4),
        transparent
    );
    transform:skewX(-20deg);
    animation:buttonShine 3.5s infinite;
}

@keyframes buttonShine{
    0%,65%{
        left:-70px;
    }
    85%,100%{
        left:130%;
    }
}

.startBtn:hover{
    background:#ff2020;
    color:white;
    transform:translateY(-2px);
    box-shadow:
        0 0 25px rgba(255,0,0,.25),
        0 0 60px rgba(255,0,0,.08);
}

.startBtn svg{
    width:18px;
    height:18px;
}

/* =========================
   CREATOR
========================= */

.creator{
    position:absolute;
    bottom:20px;
    color:#555;
    font-size:12px;
}

.creator span{
    color:#aaa;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .page{
        padding:12px;
    }

    .card{
        min-height:calc(100vh - 24px);
        border-radius:24px;
        padding:35px 18px;
    }

    .logoContainer{
        width:105px;
        height:105px;
    }

    h1{
        letter-spacing:-2px;
    }

    .subtitle{
        max-width:310px;
        line-height:1.5;
    }

    .tags{
        max-width:310px;
    }

    .startBtn{
        margin-top:28px;
    }
}

@media(prefers-reduced-motion:reduce){
    *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
    }
}
</style>
</head>

<body>

<div class="background">

    <div class="lines">
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
    </div>

    <div class="grid"></div>

    <div class="particles"></div>

    <div class="orb red"></div>
    <div class="orb blue"></div>

</div>

<main class="page">

    <section class="card">

        <div class="logoContainer">

            <div class="logoGlow"></div>

            <div class="logoRing"></div>

            <img
                class="logo"
                src="https://i.ibb.co/whKQvZsw/Nova.jpg"
                alt="Nova IA"
            >

        </div>

        <h1>
            Bienvenido a <span>Nova IA</span>
        </h1>

        <p class="subtitle">
            Tu asistente especializado en Delta Executor
        </p>

        <div class="tags">

            <div class="tag">Lua</div>
            <div class="tag">Roblox</div>
            <div class="tag">Delta</div>
            <div class="tag">Scripts</div>
            <div class="tag">Debug</div>

        </div>

        <button class="startBtn" onclick="openIA()">

            <span>Comenzar con Nova</span>

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M5 12h14"></path>
                <path d="m13 6 6 6-6 6"></path>
            </svg>

        </button>

    </section>

    <div class="creator">
        Creada por <span>Yander</span>
    </div>

</main>

<script>
function openIA(){

    const card=document.querySelector(".card");

    card.style.opacity="0";
    card.style.transform="scale(.97) translateY(10px)";

    setTimeout(()=>{
        window.location.href="ia.html";
    },220);
}
</script>

</body>
</html>
