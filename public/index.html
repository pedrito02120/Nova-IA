<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA IA</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --yellow:#fff000;
    --yellow2:#ffe600;
    --cyan:#5bdcff;
    --cyan2:#20c8ff;
    --black:#030303;
    --black2:#080808;
    --white:#f5f5f5;
}

html,body{
    width:100%;
    height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#030303;
    color:white;
    overflow:hidden;
}

/* FONDO */
.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
    background:
        radial-gradient(circle at 50% 20%,rgba(255,240,0,.07),transparent 28%),
        radial-gradient(circle at 85% 75%,rgba(40,210,255,.06),transparent 25%),
        #030303;
}

.grid{
    position:absolute;
    inset:-50%;
    width:200%;
    height:200%;
    opacity:.13;
    background-image:
        linear-gradient(rgba(255,240,0,.13) 1px,transparent 1px),
        linear-gradient(90deg,rgba(91,220,255,.10) 1px,transparent 1px);
    background-size:55px 55px;
    transform:perspective(500px) rotateX(62deg);
    animation:gridMove 18s linear infinite;
}

@keyframes gridMove{
    from{transform:perspective(500px) rotateX(62deg) translateY(0);}
    to{transform:perspective(500px) rotateX(62deg) translateY(55px);}
}

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(35px);
    opacity:.18;
}

.orb.one{
    width:260px;
    height:260px;
    background:var(--yellow);
    left:-80px;
    top:15%;
    animation:orbOne 12s ease-in-out infinite;
}

.orb.two{
    width:230px;
    height:230px;
    background:var(--cyan);
    right:-80px;
    bottom:10%;
    animation:orbTwo 15s ease-in-out infinite;
}

@keyframes orbOne{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(100px,80px);}
}

@keyframes orbTwo{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(-100px,-70px);}
}

.stars{
    position:absolute;
    inset:0;
    background-image:
        radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1px),
        radial-gradient(circle,rgba(255,240,0,.7) 1px,transparent 1px);
    background-size:90px 90px,140px 140px;
    background-position:10px 20px,40px 70px;
    opacity:.12;
    animation:starsMove 25s linear infinite;
}

@keyframes starsMove{
    from{transform:translate(0,0);}
    to{transform:translate(-90px,90px);}
}

/* CONTENIDO */
.page{
    position:relative;
    z-index:2;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.card{
    width:min(900px,100%);
    min-height:600px;
    border:1px solid rgba(255,240,0,.18);
    border-radius:30px;
    background:rgba(5,5,5,.72);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:
        0 0 80px rgba(255,240,0,.06),
        inset 0 0 50px rgba(255,255,255,.015);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:55px 30px;
    animation:cardIn 1s cubic-bezier(.16,1,.3,1);
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(35px) scale(.97);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* LOGO */
.logoWrap{
    position:relative;
    width:130px;
    height:130px;
    margin-bottom:28px;
    animation:logoFloat 4s ease-in-out infinite;
}

.logoGlow{
    position:absolute;
    inset:-18px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,240,0,.28),transparent 65%);
    filter:blur(10px);
    animation:glowPulse 2.8s ease-in-out infinite;
}

.logoRing{
    position:absolute;
    inset:-8px;
    border:1px solid rgba(91,220,255,.45);
    border-radius:50%;
    animation:ringRotate 8s linear infinite;
}

.logoRing::before{
    content:"";
    position:absolute;
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 14px var(--cyan);
    top:7px;
    left:50%;
}

.logo{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    border:3px solid var(--yellow);
    box-shadow:
        0 0 25px rgba(255,240,0,.35),
        0 0 55px rgba(255,240,0,.12);
}

@keyframes logoFloat{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
}

@keyframes glowPulse{
    0%,100%{opacity:.55;transform:scale(.95);}
    50%{opacity:1;transform:scale(1.08);}
}

@keyframes ringRotate{
    to{transform:rotate(360deg);}
}

h1{
    font-size:clamp(38px,7vw,68px);
    letter-spacing:-3px;
    font-weight:800;
    color:white;
    text-shadow:0 0 25px rgba(255,240,0,.1);
    animation:titleIn 1s .15s both cubic-bezier(.16,1,.3,1);
}

h1 span{
    color:var(--yellow);
}

.subtitle{
    margin-top:12px;
    color:#999;
    font-size:16px;
    text-align:center;
    animation:titleIn 1s .25s both cubic-bezier(.16,1,.3,1);
}

@keyframes titleIn{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* BOTÓN */
.startBtn{
    margin-top:38px;
    height:52px;
    padding:0 26px;
    border:1px solid rgba(255,240,0,.65);
    border-radius:15px;
    background:rgba(255,240,0,.08);
    color:var(--yellow);
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:10px;
    transition:.25s ease;
    position:relative;
    overflow:hidden;
    animation:buttonIn 1s .4s both cubic-bezier(.16,1,.3,1);
}

.startBtn::before{
    content:"";
    position:absolute;
    width:40px;
    height:100%;
    top:0;
    left:-70px;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.4),
        transparent
    );
    transform:skewX(-20deg);
    animation:buttonShine 3.5s infinite;
}

@keyframes buttonShine{
    0%,65%{left:-70px;}
    85%,100%{left:130%;}
}

@keyframes buttonIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.startBtn:hover{
    transform:translateY(-2px);
    background:var(--yellow);
    color:#000;
    box-shadow:0 0 30px rgba(255,240,0,.2);
}

.startBtn svg{
    width:18px;
    height:18px;
}

/* CREATOR */
.creator{
    position:absolute;
    bottom:22px;
    color:#666;
    font-size:12px;
}

.creator span{
    color:#aaa;
}

/* MOBILE */
@media(max-width:600px){
    .page{
        padding:12px;
    }

    .card{
        min-height:calc(100vh - 24px);
        border-radius:25px;
        padding:35px 20px;
    }

    .logoWrap{
        width:105px;
        height:105px;
    }

    h1{
        letter-spacing:-2px;
    }

    .subtitle{
        max-width:300px;
        line-height:1.5;
    }
}

@media(prefers-reduced-motion:reduce){
    *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
    }
}
</style>
</head>

<body>

<div class="background">
    <div class="grid"></div>
    <div class="stars"></div>
    <div class="orb one"></div>
    <div class="orb two"></div>
</div>

<main class="page">

    <section class="card">

        <div class="logoWrap">
            <div class="logoGlow"></div>
            <div class="logoRing"></div>
            <img
                class="logo"
                src="https://i.ibb.co/whKQvZsw/Nova.jpg"
                alt="NOVA IA"
            >
        </div>

        <h1>NOVA <span>IA</span></h1>

        <p class="subtitle">
            Tu asistente inteligente para programación,
            Roblox y mucho más.
        </p>

        <button class="startBtn" onclick="openIA()">
            <span>Comenzar</span>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14"></path>
                <path d="m13 6 6 6-6 6"></path>
            </svg>
        </button>

    </section>

    <div class="creator">
        Creada por <span>Yander</span>
    </div>

</main>

<script>
function openIA(){
    document.querySelector(".card").style.transform="scale(.97)";
    document.querySelector(".card").style.opacity="0";

    setTimeout(()=>{
        window.location.href="ia.html";
    },220);
}
</script>

</body>
</html>
