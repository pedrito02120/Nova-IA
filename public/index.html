<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova IA</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --yellow:#fff000;
    --yellow2:#ffe600;
    --cyan:#59d9ff;
    --cyan2:#27c8ff;
    --black:#030303;
    --panel:#090909;
    --border:#202020;
    --text:#f5f5f5;
    --muted:#8b8b8b;
}

html,body{
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--black);
    color:var(--text);
}

body{
    min-height:100vh;
    overflow-x:hidden;
    background:
        radial-gradient(circle at 50% 5%,rgba(255,240,0,.08),transparent 32%),
        radial-gradient(circle at 90% 70%,rgba(89,217,255,.06),transparent 30%),
        #030303;
}

/* FONDO */

.background{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.glow-yellow{
    position:absolute;
    width:420px;
    height:420px;
    top:-230px;
    left:50%;
    transform:translateX(-50%);
    border-radius:50%;
    background:rgba(255,240,0,.08);
    filter:blur(80px);
}

.glow-cyan{
    position:absolute;
    width:300px;
    height:300px;
    right:-150px;
    bottom:-100px;
    border-radius:50%;
    background:rgba(89,217,255,.07);
    filter:blur(80px);
}

.grid{
    position:absolute;
    inset:0;
    opacity:.15;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:50px 50px;
    mask-image:linear-gradient(to bottom,black,transparent 80%);
}

/* CONTENIDO */

.container{
    position:relative;
    z-index:2;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px 20px;
}

.content{
    width:100%;
    max-width:760px;
    text-align:center;
}

/* LOGO */

.logo-container{
    position:relative;
    width:116px;
    height:116px;
    margin:0 auto 30px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo-glow{
    position:absolute;
    inset:-15px;
    border-radius:50%;
    background:rgba(255,240,0,.08);
    filter:blur(25px);
}

.logo-ring{
    position:absolute;
    inset:0;
    border:1px solid rgba(255,240,0,.45);
    border-radius:50%;
    box-shadow:
        0 0 30px rgba(255,240,0,.08),
        inset 0 0 20px rgba(89,217,255,.04);
}

.logo{
    width:84px;
    height:84px;
    object-fit:cover;
    border-radius:50%;
    border:1px solid rgba(89,217,255,.7);
    position:relative;
    z-index:2;
}

/* TEXTO */

h1{
    font-size:clamp(42px,8vw,68px);
    line-height:1;
    letter-spacing:-2.5px;
    font-weight:800;
    margin-bottom:18px;
}

h1 .yellow{
    color:var(--yellow);
    text-shadow:0 0 25px rgba(255,240,0,.12);
}

h1 .cyan{
    color:var(--cyan);
    text-shadow:0 0 25px rgba(89,217,255,.1);
}

.subtitle{
    color:#aaa;
    font-size:17px;
    line-height:1.6;
    max-width:600px;
    margin:0 auto;
}

.description{
    color:#737373;
    font-size:14px;
    line-height:1.7;
    max-width:540px;
    margin:15px auto 0;
}

/* TAGS */

.tags{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    margin:27px auto 30px;
}

.tag{
    padding:8px 13px;
    border:1px solid #242424;
    border-radius:999px;
    background:#0a0a0a;
    color:#999;
    font-size:12px;
}

.tag:nth-child(1),
.tag:nth-child(3){
    border-color:rgba(255,240,0,.2);
}

.tag:nth-child(2),
.tag:nth-child(4){
    border-color:rgba(89,217,255,.2);
}

/* BOTÓN */

.start-button{
    height:52px;
    padding:0 28px;
    border-radius:13px;
    border:1px solid var(--yellow);
    background:var(--yellow);
    color:#050505;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:.2s ease;
    box-shadow:0 0 25px rgba(255,240,0,.08);
}

.start-button:hover{
    background:#fff84d;
    border-color:#fff84d;
    transform:translateY(-2px);
    box-shadow:0 8px 30px rgba(255,240,0,.13);
}

.start-button:active{
    transform:translateY(0);
}

/* CREADOR */

.creator{
    margin-top:25px;
    color:#666;
    font-size:12px;
}

.creator strong{
    color:var(--cyan);
    font-weight:500;
}

/* MOBILE */

@media(max-width:600px){

    .container{
        padding:25px 18px;
    }

    .logo-container{
        width:100px;
        height:100px;
        margin-bottom:25px;
    }

    .logo{
        width:73px;
        height:73px;
    }

    h1{
        font-size:43px;
        letter-spacing:-1.8px;
    }

    .subtitle{
        font-size:15px;
    }

    .description{
        font-size:13px;
    }

    .start-button{
        width:100%;
        max-width:330px;
    }
}

@media(prefers-reduced-motion:reduce){
    *{
        transition:none!important;
    }
}
</style>
</head>

<body>

<div class="background">
    <div class="glow-yellow"></div>
    <div class="glow-cyan"></div>
    <div class="grid"></div>
</div>

<div class="container">

    <main class="content">

        <div class="logo-container">
            <div class="logo-glow"></div>
            <div class="logo-ring"></div>

            <img
                class="logo"
                src="https://i.ibb.co/whKQvZsw/Nova.jpg"
                alt="Nova IA"
            >
        </div>

        <h1>
            <span class="yellow">Nova</span>
            <span class="cyan">IA</span>
        </h1>

        <p class="subtitle">
            Tu asistente especializado en programación,
            Roblox y desarrollo.
        </p>

        <p class="description">
            Crea scripts, corrige errores, desarrolla sistemas
            y convierte tus ideas en código.
        </p>

        <div class="tags">
            <span class="tag">Lua</span>
            <span class="tag">Roblox</span>
            <span class="tag">Delta</span>
            <span class="tag">Scripts</span>
            <span class="tag">Debug</span>
        </div>

        <button
            class="start-button"
            onclick="startProgramming()"
        >
            Comenzar con Nova
        </button>

        <div class="creator">
            Creada por <strong>Yander</strong>
        </div>

    </main>

</div>

<script>
function startProgramming(){
    window.location.href = "ia.html";
}
</script>

</body>
</html>
